<!doctype html>
<!--
  Template: 3D animation, narrated (references/video-types.md: explainer,
  ad, launch, brand profile, educational). 17 seconds: a voiceover over 3D
  scenes drawn with three.js in the brand's colors, word-by-word captions
  synced to the voice, and the hook on screen from the very first frame.

  Usually made by scripts/video/compose.js with "style: 3d" in the script's
  frontmatter: it voices the script, gives each line a shot ([shot: hero] on
  a line picks one), times everything to the voice, and writes this page.
  By hand: each line is a scene holding
    <div class="say auto" data-voice="assets/voice-2.wav" style="--voice:3.4s">The line.</div>
  and each shot is an empty <div class="shot" data-shot="..." style="--in:3.4s">,
  usually one per line. Without a voice clip, the captions here run at a
  steady reading pace, as a preview.

  Shots (data-shot), each running from its --in until the next shot starts:
    shapes  glossy shapes floating in the brand's colors. Any line; a good hook.
    hero    a phone turning toward the camera. data-src="assets/screen.png" puts
            the user's real screenshot on its screen; without one it shows a
            generic interface. Event: --land.
    cards   cards flying in and stacking, one per item: data-items="Research,
            Write,Post" (short labels; emoji work). Events: --card-1, --card-2...
    chart   bars growing: data-values="12,30,85", the user's real numbers only.
            Without data-values it draws a plain rising icon, not data.
            Event: --top, when the last bar tops out.
    coin    a coin or badge spinning in and landing: data-src="assets/logo.png"
            puts the logo on its face, otherwise a star. Event: --land.
    rings   flying through a tunnel of rings. Energy, a transition, a hook.
    globe   a dotted globe with arcs between places, for reach and "anywhere".
            Events: --arc-1, --arc-2...
  data-sfx on a shot cues a sound on one of its events, e.g. data-sfx="ding:land"
  (the events are set when the page loads, so render.js finds them).

  How it draws: the page defines window.renderFrame(t), which render.js calls
  with the time of every frame, so the 3D is frame-exact like the CSS. three.js
  0.186.1 comes from scripts/video/node_modules (npm install), or from
  jsDelivr when the page is opened in a browser. Colors come from --accent and
  --bg, so brand.js restyles the 3D too. Screenshots and logos must be the
  user's real ones; the shots never show people.
  Page conventions (canvas, safe area, timing vars, backgrounds, data-sfx
  cues, music, assets): see the comment at the top of promo.html.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500&family=TikTok+Sans:wght@500..900&family=Noto+Color+Emoji&display=block">
<style>
  :root {
    --bg: #0f0f13;
    --card: #1b1b22;
    --line: #2b2b35;
    --text: #f3f2ee;
    --muted: #9a99a4;
    --accent: #e07a55;
    --ok: #3fbf7f;
    --bad: #e0605a;
    --warn: #e8b04a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: "Inter", "Liberation Sans", "Noto Color Emoji", sans-serif; color: var(--text); position: relative; }

  .glow { position: absolute; border-radius: 50%; filter: blur(120px); opacity: .55; }
  .g1 { width: 900px; height: 900px; background: #000; left: -300px; top: -200px; animation: drift1 24s linear 0s both; }
  .g2 { width: 800px; height: 800px; background: #000; right: -320px; bottom: -160px; animation: drift2 24s linear 0s both; }
  @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(260px, 520px); } }
  @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-220px, -600px); } }

  /* scenes: content kept inside the platform-UI safe zone */
  .scene { position: absolute; left: 90px; right: 150px; top: 330px; bottom: 470px;
           display: flex; flex-direction: column; justify-content: center;
           animation: sceneOut .35s ease-in var(--out, 999s) forwards; }
  @keyframes sceneOut { to { opacity: 0; transform: translateY(-60px); } }

  /* entrances; .gone also leaves at its own --out */
  .pop   { animation: popIn .5s cubic-bezier(.2,.9,.3,1.25) var(--in) both; }
  .rise  { animation: riseIn .45s cubic-bezier(.2,.8,.2,1) var(--in) both; }
  .slide { animation: slideIn .4s cubic-bezier(.2,.8,.2,1) var(--in) both; }
  .fade  { animation: fadeIn .4s ease-out var(--in) both; }
  .gone  { animation: fadeIn .35s ease-out var(--in) both, fadeOut .3s ease-in var(--out) forwards; }
  @keyframes popIn   { from { opacity: 0; transform: scale(.6) translateY(40px); } to { opacity: 1; transform: none; } }
  @keyframes riseIn  { from { opacity: 0; transform: translateY(70px); } to { opacity: 1; transform: none; } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(160px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { to { opacity: 0; } }

  .huge { font-size: 132px; font-weight: 800; line-height: 1.02; letter-spacing: -4px; }
  .big  { font-size: 104px; font-weight: 800; line-height: 1.04; letter-spacing: -3px; }
  .mid  { font-size: 64px;  font-weight: 700; line-height: 1.12; letter-spacing: -1.5px; }
  .small{ font-size: 42px;  font-weight: 500; line-height: 1.3; color: var(--muted); }
  .label{ font-size: 34px;  font-weight: 700; letter-spacing: 4px; text-transform: uppercase; }
  .accent { color: var(--accent); }
  .center { text-align: center; align-items: center; }

  /* counts up from 0 to --to, starting at --in: <span class="count" style="--in:3s; --to:40"></span>
     (--for and --ease change its pace; add class "pct" for a % sign) */
  @property --n { syntax: '<integer>'; inherits: false; initial-value: 0; }
  .count { counter-reset: n var(--n); animation: countUp var(--for, 1.2s) var(--ease, cubic-bezier(.2,.8,.2,1)) var(--in) both; }
  .pct::after { content: '%'; }
  .count::before { content: counter(n); }
  @keyframes countUp { from { --n: 0; } to { --n: var(--to); } }

  /* background media: one photo or clip per scene, behind the text (see promo.html) */
  .bg { position: absolute; inset: 0; overflow: hidden; isolation: isolate; background: #000;
        animation: fadeIn .45s ease-out var(--in) both, fadeOut .45s ease-in var(--out, 999s) forwards; }
  .bg.now { animation: fadeOut .45s ease-in var(--out, 999s) forwards; }
  .bg:empty { display: none; }
  .bg-media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0;
              filter: var(--grade, saturate(.9) contrast(1.05) brightness(.9));
              animation: var(--kb, kbIn) var(--dur, 8s) linear var(--in) both; }
  .bg.blur .bg-media { filter: var(--grade, saturate(.9) contrast(1.05) brightness(.9)) blur(var(--blur, 10px)); }
  @keyframes kbIn    { from { transform: scale(1.02); } to { transform: scale(1.14); } }
  @keyframes kbOut   { from { transform: scale(1.14); } to { transform: scale(1.02); } }
  @keyframes kbLeft  { from { transform: scale(1.14) translateX(3%); } to { transform: scale(1.14) translateX(-3%); } }
  @keyframes kbRight { from { transform: scale(1.14) translateX(-3%); } to { transform: scale(1.14) translateX(3%); } }
  .bg.tint::before { content: ''; position: absolute; inset: 0; z-index: 1; background: var(--accent); mix-blend-mode: soft-light; opacity: .5; }
  .bg::after { content: ''; position: absolute; inset: 0; z-index: 2;
               background: linear-gradient(to bottom, rgba(10,10,14,.72), rgba(10,10,14,.12) 30%, rgba(10,10,14,.22) 62%, rgba(10,10,14,.88)),
                           rgba(10,10,14,var(--shade, .35)); }
  body:has(.bg-media) { --muted: #d2d1d8; }
  body:has(.bg-media) .scene, body:has(.bg-media) .stage { text-shadow: 0 2px 6px rgba(0,0,0,.35), 0 4px 30px rgba(0,0,0,.55); }

  /* on screen from the very first frame, with a small settle instead of an entrance: for the
     hook, since the first frame is the default cover and the moment a viewer decides to stay */
  .now { animation: nowIn .5s cubic-bezier(.2,.8,.2,1) 0s both, fadeOut .3s ease-in var(--out, 999s) forwards; }
  @keyframes nowIn { from { transform: scale(1.05); } to { transform: none; } }

  /* the end card brand.js adds: the logo and handle, landing on the sonic logo */
  .endcard { position: absolute; left: 90px; right: 150px; top: 330px; bottom: 470px; z-index: 5;
             display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; text-align: center;
             animation: fadeIn .35s ease-out var(--in, 999s) both; }
  .endcard .logo { max-width: 380px; max-height: 300px; object-fit: contain; animation: popIn .55s cubic-bezier(.2,.9,.3,1.25) var(--in, 999s) both; }
  .endcard .handle { font-size: 60px; font-weight: 800; letter-spacing: -1px; animation: riseIn .45s cubic-bezier(.2,.8,.2,1) calc(var(--in, 999s) + .15s) both; }

  /* ---- everyday / FYP kit ---- */
  body.fyp { font-family: "TikTok Sans", "Inter", "Liberation Sans", "Noto Color Emoji", sans-serif; text-wrap: pretty; }
  .fyp .huge, .fyp .big { letter-spacing: -2px; }
  .fyp .glow { opacity: .9; }
  .scene.top { justify-content: flex-start; }
  .scene.bottom { justify-content: flex-end; }
  .stack { display: grid; place-items: center; text-align: center; }
  .stack > * { grid-area: 1 / 1; }
  .swap { animation: popIn .45s cubic-bezier(.2,.9,.3,1.25) var(--in) both, fadeOut .25s ease-in var(--out, 999s) forwards; }
  body:has(.bg-media) :is(.cap, .sticker, .stamp, .say, .chat, .post, .reply, .notif, .popup, .cell, .tiers, .pane, .side) { text-shadow: none; }

  /* captions in the platforms' own style, each wrapped line boxed */
  .cap { font-size: 64px; font-weight: 700; line-height: 1.44; letter-spacing: -.5px; text-align: center; text-wrap: balance; }
  .cap > span { background: #fff; color: #121212; padding: .05em .32em; border-radius: .2em;
                -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .cap.dark > span { background: rgba(0,0,0,.76); color: #fff; }
  .cap.hl > span { background: var(--accent); color: #fff; }
  .cap.out { font-size: 82px; font-weight: 900; line-height: 1.12; color: #fff; paint-order: stroke fill; -webkit-text-stroke: 14px #000; }
  .cap.out > span { background: none; color: inherit; padding: 0; }
  .cap.left { text-align: left; }

  /* word-by-word captions: each <i> pops at its own --in, highlighted while it's the newest */
  .say { font-size: 80px; font-weight: 900; line-height: 1.16; text-align: center; color: #fff; text-wrap: balance;
         paint-order: stroke fill; -webkit-text-stroke: 14px #000; }
  .say i { font-style: normal; display: inline-block; color: var(--hi, #ffd23f);
           animation: wordIn .22s cubic-bezier(.2,1.5,.4,1) var(--in) both, wordDone .12s linear calc(var(--in) + .4s) forwards; }
  @keyframes wordIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
  @keyframes wordDone { to { color: #fff; } }

  /* labels and reactions */
  .sticker { width: fit-content; background: var(--accent); color: #fff; font-size: 44px; font-weight: 800; line-height: 1.2;
             padding: 10px 28px 12px; border-radius: 16px; rotate: -3deg; box-shadow: 0 12px 34px rgba(0,0,0,.35); }
  .sticker.yellow { background: #ffd23f; color: #121212; }
  .sticker.light { background: #fff; color: #121212; }
  .sticker.dark { background: #121212; color: #fff; }
  .stamp { width: fit-content; color: var(--accent); border: 12px solid currentColor; border-radius: 30px; background: rgba(10,10,14,.35);
           font-size: 124px; font-weight: 900; line-height: 1.12; letter-spacing: -2px; padding: 4px 36px 10px; rotate: -7deg;
           animation: stampIn .32s cubic-bezier(.3,1.5,.5,1) var(--in) both; }
  .stamp.ok { color: var(--ok); }
  .stamp.bad { color: var(--bad); }
  @keyframes stampIn { from { opacity: 0; transform: scale(2.4); } 50% { opacity: 1; } to { opacity: 1; transform: none; } }
  .emoji { width: fit-content; font-size: 190px; line-height: 1.12;
           animation: emojiIn .55s cubic-bezier(.2,1.5,.4,1) var(--in) both, sway 1.6s ease-in-out calc(var(--in) + .55s) infinite; }
  @keyframes emojiIn { from { opacity: 0; transform: scale(.2) rotate(-25deg); } to { opacity: 1; transform: none; } }
  @keyframes sway { 0%, 100% { rotate: -5deg; } 50% { rotate: 5deg; } }

  /* timers: a 3-2-1 ring and a draining bar, both running --for (default 3s) from --in */
  @property --sweep { syntax: '<angle>'; inherits: false; initial-value: 360deg; }
  @property --left { syntax: '<integer>'; inherits: false; initial-value: 3; }
  .ring { width: 270px; height: 270px; border-radius: 50%; display: grid; place-items: center;
          background: radial-gradient(closest-side, var(--bg) 84%, transparent 85%), conic-gradient(var(--accent) var(--sweep), rgba(255,255,255,.18) 0);
          animation: popIn .4s cubic-bezier(.2,.9,.3,1.25) var(--in) both, sweep var(--for, 3s) linear var(--in) both; }
  .ring b { font-size: 130px; font-weight: 900; line-height: 1; counter-reset: left var(--left);
            animation: left var(--for, 3s) steps(3, jump-none) var(--in) both; }
  .ring b::before { content: counter(left); }
  @keyframes sweep { from { --sweep: 360deg; } to { --sweep: 0deg; } }
  @keyframes left { from { --left: 3; } to { --left: 1; } }
  .timerbar { height: 20px; border-radius: 10px; background: rgba(255,255,255,.18); overflow: hidden; animation: fadeIn .2s ease-out var(--in) both; }
  .timerbar::after { content: ''; display: block; height: 100%; border-radius: inherit; background: var(--accent); transform-origin: left;
                     animation: drain var(--for, 3s) linear var(--in) both; }
  @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  /* bars: poll options grow to --pct, a progress bar fills to --pct over --for */
  .poll { display: flex; flex-direction: column; gap: 22px; }
  .opt { position: relative; display: flex; justify-content: space-between; align-items: center; height: 124px; padding: 0 38px;
         border-radius: 28px; background: rgba(255,255,255,.13); overflow: hidden; font-size: 52px; font-weight: 800;
         animation: fadeIn .3s ease-out var(--in) both; }
  .opt::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--pct, 50) * 1%); background: var(--accent);
                 animation: grow 1.2s cubic-bezier(.2,.8,.2,1) var(--in) both; }
  .opt.alt::before { background: #5c5b68; }
  .opt > * { position: relative; }
  @keyframes grow { from { width: 0; } }
  .progress { height: 70px; border-radius: 35px; background: rgba(255,255,255,.13); border: 3px solid rgba(255,255,255,.28); overflow: hidden;
              animation: fadeIn .3s ease-out var(--in) both; }
  .progress::before { content: ''; display: block; height: 100%; width: calc(var(--pct, 100) * 1%);
                      background: repeating-linear-gradient(-45deg, var(--accent) 0 26px, color-mix(in srgb, var(--accent) 78%, #fff) 26px 52px);
                      animation: grow var(--for, 3s) var(--ease, cubic-bezier(.15,.85,.25,1)) var(--in) both; }

  /* layouts: two stacked panes, a starter-pack grid, a tier list */
  .split { flex: 1; display: flex; flex-direction: column; gap: 24px; }
  .pane, .side { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 gap: 14px; text-align: center; padding: 100px 40px 44px; background: var(--card); }
  .pane { flex: 1; border-radius: 36px; border: 2px solid var(--line); }
  :is(.pane, .side) > .sticker { position: absolute; left: 30px; top: 28px; z-index: 3; }
  :is(.pane, .side, .cell) > :not(.bg-media, .sticker) { position: relative; z-index: 2; }
  :is(.pane, .side):has(> .bg-media)::after { content: ''; position: absolute; inset: 0; z-index: 1;
                                              background: linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.55)); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .cell { position: relative; overflow: hidden; background: #fff; color: #121212; border-radius: 28px; padding: 22px 18px 24px; text-align: center;
          font-size: 38px; font-weight: 700; line-height: 1.15; box-shadow: 0 16px 40px rgba(0,0,0,.3); rotate: -1.5deg; }
  .cell:nth-child(even) { rotate: 1.5deg; }
  .cell .e { font-size: 104px; line-height: 1.2; }
  .cell, .popup b { text-wrap: balance; }
  .tiers { display: flex; flex-direction: column; gap: 10px; }
  .tier { display: flex; min-height: 128px; background: rgba(22,22,28,.9); border-radius: 18px; overflow: hidden; }
  .tier > b { flex: none; width: 124px; display: grid; place-items: center; font-size: 64px; font-weight: 900; color: #121212; background: var(--t); }
  .tier.s { --t: #ff7f7f; } .tier.a { --t: #ffbf7f; } .tier.b { --t: #ffdf7f; } .tier.c { --t: #bfff7f; } .tier.d { --t: #7fbfff; }
  .items { flex: 1; display: flex; flex-wrap: wrap; align-content: center; gap: 12px; padding: 14px 16px; }
  .item { background: #fff; color: #121212; border-radius: 16px; padding: 10px 20px; font-size: 40px; font-weight: 700; white-space: nowrap; }

  /* a fictional chat: .msg.them / .msg.me, each a .bub, with .typing dots between --in and --out */
  .chat { background: #f4f3ef; color: #121212; border-radius: 44px; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,.5); }
  .chat-head { display: flex; align-items: center; gap: 22px; padding: 26px 32px; background: #fff; border-bottom: 2px solid #e6e3dc; }
  .chat-head b, .post-head b { display: block; font-size: 40px; font-weight: 800; line-height: 1.2; }
  .chat-head small, .post-head small { display: block; font-size: 28px; font-weight: 600; color: #8a8994; }
  .av { width: 84px; height: 84px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 46px; font-style: normal;
        background: linear-gradient(135deg, var(--accent), #6b3b4b); }
  .chat-body { display: flex; flex-direction: column; gap: 16px; padding: 30px 30px 40px; }
  .msg { display: grid; }
  .msg > * { grid-area: 1 / 1; }
  .msg.me { justify-items: end; }
  .msg.them { justify-items: start; }
  .bub { max-width: 600px; padding: 20px 30px 22px; border-radius: 36px; font-size: 42px; font-weight: 600; line-height: 1.25;
         animation: bubIn .35s cubic-bezier(.2,.9,.3,1.3) var(--in) both; }
  .them .bub { background: #e4e2dc; border-bottom-left-radius: 10px; transform-origin: 0 100%; }
  .me .bub { background: var(--accent); color: #fff; border-bottom-right-radius: 10px; transform-origin: 100% 100%; }
  @keyframes bubIn { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: none; } }
  .typing { display: flex; gap: 10px; padding: 28px 30px; border-radius: 36px; background: #e4e2dc; width: fit-content;
            animation: fadeIn .2s ease-out var(--in) both, fadeOut .15s linear var(--out) forwards; }
  .typing i { width: 16px; height: 16px; border-radius: 50%; background: #8a8994; animation: dot 1s ease-in-out infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 30% { transform: translateY(-10px); opacity: .5; } }

  /* a lock screen: .notif cards slide in at --in, newest on top, pushing the rest down */
  .lock { display: flex; flex-direction: column; align-items: center; }
  .clock { font-size: 180px; font-weight: 700; letter-spacing: -6px; line-height: 1; }
  .date { font-size: 42px; font-weight: 600; margin: 8px 0 26px; }
  .notifs { align-self: stretch; display: flex; flex-direction: column-reverse; justify-content: flex-end; }
  .notif { display: flex; gap: 22px; align-items: flex-start; padding: 24px 28px; border-radius: 34px; overflow: hidden; text-align: left;
           background: rgba(246,245,241,.9); color: #121212; box-shadow: 0 16px 40px rgba(0,0,0,.25);
           animation: notifIn .5s cubic-bezier(.2,.9,.3,1.1) var(--in) both; }
  @keyframes notifIn { from { max-height: 0; padding-top: 0; padding-bottom: 0; margin-top: 0; opacity: 0; transform: scale(.9); }
                       to { max-height: 320px; margin-top: 18px; opacity: 1; transform: none; } }
  .app { width: 76px; height: 76px; flex: none; border-radius: 20px; display: grid; place-items: center; font-size: 44px; font-style: normal; background: #fff; }
  .notif > div { flex: 1; min-width: 0; }
  .n-head { display: flex; justify-content: space-between; font-size: 30px; font-weight: 800; }
  .n-head time { font-weight: 600; color: #6a6a74; }
  .notif p { font-size: 38px; font-weight: 600; line-height: 1.25; margin-top: 4px; }

  /* a generic social post (no real app's look) with a .heart that fills at --like, and .reply comments */
  .post { background: #fff; color: #121212; border-radius: 40px; padding: 34px 36px 26px; box-shadow: 0 40px 120px rgba(0,0,0,.45); }
  .post-head { display: flex; align-items: center; gap: 20px; margin-bottom: 22px; }
  .post-text { font-size: 52px; font-weight: 700; line-height: 1.2; }
  .post-bar { display: flex; gap: 44px; align-items: center; margin-top: 28px; padding-top: 22px; border-top: 2px solid #ecebe6;
              font-size: 34px; font-weight: 700; color: #6a6a74; }
  .post-bar > span { display: flex; align-items: center; gap: 12px; }
  .post-bar svg { width: 46px; height: 46px; }
  .heart { animation: beat .45s cubic-bezier(.2,1.6,.4,1) var(--like, 999s) both; }
  .heart path { fill: none; stroke: #6a6a74; stroke-width: 2.2; animation: liked .2s ease-out var(--like, 999s) forwards; }
  @keyframes beat { 40% { transform: scale(1.45); } }
  @keyframes liked { to { fill: #ff3b5c; stroke: #ff3b5c; } }
  .reply { display: flex; gap: 18px; align-items: flex-start; width: fit-content; max-width: 100%; margin-top: 18px; padding: 22px 28px;
           border-radius: 30px; background: rgba(255,255,255,.94); color: #121212; }
  .reply .av { width: 64px; height: 64px; font-size: 34px; }
  .reply b { display: block; font-size: 28px; color: #6a6a74; }

  /* a generic system dialog */

  .side + .side { background: #2a2a34; clip-path: inset(0 100% 0 0);
                  animation: wipe .9s cubic-bezier(.7,0,.25,1) var(--at) both, show .01s linear var(--at) both; }
  .side:first-child { animation: fadeOut .01s linear calc(var(--at) + .9s) forwards; }
  .wipe::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 10px; margin-left: -5px; z-index: 5; background: #fff;
                 box-shadow: 0 0 30px rgba(0,0,0,.5); opacity: 0; animation: seam .9s cubic-bezier(.7,0,.25,1) var(--at) both; }
  @keyframes wipe { to { clip-path: inset(0 0 0 0); } }
  @keyframes show { from { opacity: 0; } to { opacity: 1; } }
  @keyframes seam { from { left: 0; opacity: 0; } 3% { opacity: 1; } 97% { opacity: 1; } to { left: 100%; opacity: 0; } }

  /* hits: a white flash over the frame at --in; a zoom-and-shake on whatever .hit wraps, at --hit */
  .flash { position: absolute; inset: 0; z-index: 20; background: #fff; pointer-events: none; animation: flash .45s ease-out var(--in) both; }

  @keyframes hit { 0% { transform: none; } 12% { transform: scale(1.12) translate(-10px, 6px); } 24% { transform: scale(1.1) translate(12px, -8px); }
                   36% { transform: scale(1.09) translate(-8px, -4px); } 48% { transform: scale(1.07) translate(6px, 6px); } 100% { transform: scale(1.05); } }


  .glow { display: none; }

  .narr .say { min-height: 220px; }
  .art-scrim { position: absolute; inset: 0; pointer-events: none;
               background: linear-gradient(to bottom, rgba(0,0,0,.28), rgba(0,0,0,0) 22%, rgba(0,0,0,0) 56%, rgba(0,0,0,.5) 78%, rgba(0,0,0,.3)); }

<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---- frame, colors, helpers
const W = 1080, H = 1920;
const LIFT = 190; // the subject sits this far above the frame's middle, clear of the captions
const css = getComputedStyle(document.documentElement);
const cssColor = (name, fallback) => new THREE.Color(css.getPropertyValue(name).trim() || fallback);
const SRGB = THREE.SRGBColorSpace;
const accent = cssColor('--accent', '#e07a55');
const hsl = accent.getHSL({}, SRGB);
const PAL = {
  accent,
  second: new THREE.Color().setHSL((hsl.h + 0.55) % 1, Math.min(0.65, hsl.s), 0.56, SRGB),
  third: new THREE.Color().setHSL((hsl.h + 0.09) % 1, Math.min(0.85, hsl.s + 0.1), 0.7, SRGB),
  pearl: new THREE.Color('#f2f0ec'),
  ink: new THREE.Color('#17171d'),
  bg: cssColor('--bg', '#0f0f13'),
};
const hex = (c) => `#${c.getHexString()}`;
const clamp = (x) => Math.min(1, Math.max(0, x));
const lerp = (a, b, k) => a + (b - a) * k;
const out3 = (x) => 1 - (1 - clamp(x)) ** 3;
const inOut = (x) => { x = clamp(x); return x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2; };
const back = (x) => { x = clamp(x); return 1 + 2.6 * (x - 1) ** 3 + 1.6 * (x - 1) ** 2; };
function rng(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) >>> 0;
    let t = seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const loadImage = (src) => new Promise((resolve, reject) => {
  const img = new Image();
  img.onload = () => resolve(img);
  img.onerror = () => reject(new Error(`image didn't load: ${src}`));
  img.src = src;
});
const canvas2d = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
// a browser opened on the file (not render.js) can refuse to read a local image into WebGL
const readable = (g) => { try { g.getImageData(0, 0, 1, 1); return true; } catch { return false; } };
const texture = (c) => { const t = new THREE.CanvasTexture(c); t.colorSpace = SRGB; t.anisotropy = 4; return t; };
const FONT = getComputedStyle(document.body).fontFamily;

// ---- renderer: one WebGL canvas, lit by a studio environment for soft reflections
const renderer = new THREE.WebGLRenderer({ canvas: document.querySelector('canvas.art'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.NeutralToneMapping; // keeps the brand colors true; ACES washes them out
renderer.outputColorSpace = SRGB;
const env = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const glossy = (c, rough = 0.28) => new THREE.MeshPhysicalMaterial({ color: c, roughness: rough, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.12 });
const metal = (c, rough = 0.24) => new THREE.MeshStandardMaterial({ color: c, roughness: rough, metalness: 0.85 });
const glow = (c, k = 0.6) => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: k, roughness: 0.35, metalness: 0.2 });

// A soft radial backdrop: the brand's background, lifted toward the accent in the middle.
function backdrop(tint) {
  const [c, g] = canvas2d(270, 480);
  const mid = PAL.bg.clone().lerp(PAL.accent, tint);
  const grad = g.createRadialGradient(135, 190, 8, 135, 220, 340);
  grad.addColorStop(0, hex(mid));
  grad.addColorStop(1, hex(PAL.bg.clone().multiplyScalar(0.5)));
  g.fillStyle = grad;
  g.fillRect(0, 0, 270, 480);
  return { tex: texture(c), mid };
}

// A soft shadow on an invisible floor, under whatever stands on it.
let shadowTex;
function contactShadow(width, y, opacity = 0.5) {
  if (!shadowTex) {
    const [c, g] = canvas2d(128, 128);
    const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    grad.addColorStop(0, 'rgba(0,0,0,1)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 128, 128);
    shadowTex = new THREE.CanvasTexture(c);
  }
  const m = new THREE.Mesh(new THREE.PlaneGeometry(width, width * 0.5), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, opacity, depthWrite: false }));
  m.rotation.x = -Math.PI / 2;
  m.position.y = y;
  return m;
}

// A flat rounded rectangle, centered.
function roundedPlane(w, h, r) {
  const s = new THREE.Shape();
  s.moveTo(-w / 2 + r, -h / 2);
  s.lineTo(w / 2 - r, -h / 2); s.absarc(w / 2 - r, -h / 2 + r, r, -Math.PI / 2, 0);
  s.lineTo(w / 2, h / 2 - r); s.absarc(w / 2 - r, h / 2 - r, r, 0, Math.PI / 2);
  s.lineTo(-w / 2 + r, h / 2); s.absarc(-w / 2 + r, h / 2 - r, r, Math.PI / 2, Math.PI);
  s.lineTo(-w / 2, -h / 2 + r); s.absarc(-w / 2 + r, -h / 2 + r, r, Math.PI, Math.PI * 1.5);
  return new THREE.ShapeGeometry(s, 12);
}

// A scene with the backdrop, the environment, a key light, and an accent rim light; and a
// camera whose view is shifted so the origin lands LIFT pixels above the middle of the frame.
function stage({ fov = 30, tint = 0.2, fog } = {}) {
  const scene = new THREE.Scene();
  const bd = backdrop(tint);
  scene.background = bd.tex;
  scene.environment = env;
  if (fog) scene.fog = new THREE.Fog(bd.mid, fog[0], fog[1]);
  const key = new THREE.DirectionalLight(0xffffff, 1.5);
  key.position.set(3, 5, 6);
  const rim = new THREE.DirectionalLight(PAL.accent, 2.4);
  rim.position.set(-4, 2, -5);
  scene.add(key, rim);
  const camera = new THREE.PerspectiveCamera(fov, W / H, 0.1, 200);
  camera.setViewOffset(W, H, 0, LIFT, W, H);
  return { scene, camera };
}
const aim = (camera, x, y, z, at = [0, 0, 0]) => { camera.position.set(x, y, z); camera.lookAt(...at); };

// An entrance: 0 to 1 over `d` seconds after `delay`, or 1 at once for the shot on the cover.
const entrance = (shot, lt, delay = 0, d = 0.7, ease = back) => (shot.first ? 1 : ease((lt - delay) / d));

// ---- the shots
const SHOTS = {};

// Glossy shapes floating in the brand's colors.
SHOTS.shapes = async (el, shot) => {
  const { scene, camera } = stage({ tint: 0.22 });
  const geo = {
    box: new RoundedBoxGeometry(1, 1, 1, 4, 0.18), torus: new THREE.TorusGeometry(0.6, 0.24, 32, 96),
    sphere: new THREE.SphereGeometry(0.62, 48, 32), ico: new THREE.IcosahedronGeometry(0.66, 0),
    capsule: new THREE.CapsuleGeometry(0.34, 0.6, 8, 32), cone: new THREE.ConeGeometry(0.55, 1, 48),
    knot: new THREE.TorusKnotGeometry(0.45, 0.15, 160, 20), octa: new THREE.OctahedronGeometry(0.62, 0),
  };
  const layout = [
    ['box', PAL.accent, -0.7, 0.95, 0.2, 0.42], ['torus', PAL.pearl, 0.8, 0.72, -0.5, 0.42],
    ['sphere', PAL.second, -0.08, 0.05, 0.8, 0.46], ['ico', PAL.third, 0.72, -0.55, 0.3, 0.34],
    ['capsule', PAL.pearl, -0.86, -0.48, -0.6, 0.36], ['cone', PAL.second, 0.15, 1.32, -1.0, 0.32],
    ['knot', PAL.accent, -0.38, -1.05, 0.5, 0.3], ['octa', PAL.accent, 0.98, 1.38, -0.4, 0.24],
  ];
  const r = rng(7);
  const items = layout.map(([kind, color, x, y, z, s], i) => {
    const m = new THREE.Mesh(geo[kind], kind === 'ico' || kind === 'octa' ? metal(color, 0.3) : glossy(color));
    m.position.set(x, y, z);
    scene.add(m);
    return { m, x, y, z, s, phase: r() * 6.28, spin: [(r() - 0.5) * 1.2, (r() - 0.5) * 1.4], delay: 0.05 * i };
  });
  return {
    scene, camera,
    update(lt) {
      for (const it of items) {
        it.m.scale.setScalar(it.s * entrance(shot, lt, it.delay, 0.6));
        it.m.position.y = it.y + 0.09 * Math.sin(lt * 1.1 + it.phase);
        it.m.rotation.set(it.phase + lt * it.spin[0], it.phase * 0.7 + lt * it.spin[1], 0);
      }
      const k = inOut(lt / shot.dur);
      aim(camera, 0.35 * Math.sin(lt * 0.35), 0.1, lerp(9.6, 8.6, k));
    },
  };
};

// A phone turning toward the camera, with the user's screenshot (data-src) on its screen.
SHOTS.hero = async (el, shot) => {
  const { scene, camera } = stage({ tint: 0.18 });
  const [w, h, radius] = [0.9, 1.9, 0.12];
  const [c, g] = canvas2d(600, 1300);
  g.beginPath();
  g.roundRect(0, 0, 600, 1300, 64);
  g.clip();
  let drawn = false;
  if (el.dataset.src) {
    const img = await loadImage(el.dataset.src);
    const k = Math.max(600 / img.width, 1300 / img.height); // cover the screen, cropping the overflow
    g.drawImage(img, (600 - img.width * k) / 2, 0, img.width * k, img.height * k);
    drawn = readable(g);
  }
  if (!drawn) { // a generic interface: header, cards, a button; no text, nothing to mistake for a real product
    const grad = g.createLinearGradient(0, 0, 0, 1300);
    grad.addColorStop(0, hex(PAL.bg.clone().lerp(PAL.accent, 0.18)));
    grad.addColorStop(1, hex(PAL.bg));
    g.fillStyle = grad;
    g.fillRect(0, 0, 600, 1300);
    g.fillStyle = hex(PAL.accent);
    g.beginPath(); g.roundRect(40, 110, 520, 220, 36); g.fill();
    g.fillStyle = 'rgba(255,255,255,.55)';
    g.beginPath(); g.roundRect(80, 160, 260, 30, 15); g.roundRect(80, 215, 180, 26, 13); g.fill();
    [PAL.second, PAL.third, PAL.pearl].forEach((col, i) => {
      const y = 380 + i * 200;
      g.fillStyle = 'rgba(255,255,255,.07)';
      g.beginPath(); g.roundRect(40, y, 520, 170, 30); g.fill();
      g.fillStyle = hex(col);
      g.beginPath(); g.arc(115, y + 85, 42, 0, 6.29); g.fill();
      g.fillStyle = 'rgba(255,255,255,.4)';
      g.beginPath(); g.roundRect(185, y + 52, 290, 24, 12); g.roundRect(185, y + 96, 200, 20, 10); g.fill();
    });
    g.fillStyle = hex(PAL.accent);
    g.beginPath(); g.roundRect(40, 1060, 520, 120, 60); g.fill();
  }
  const phone = new THREE.Group();
  phone.add(new THREE.Mesh(new RoundedBoxGeometry(w, h, 0.11, 6, radius), metal(PAL.accent, 0.3)));
  const bezel = new THREE.Mesh(roundedPlane(w - 0.04, h - 0.04, radius - 0.02), new THREE.MeshStandardMaterial({ color: 0x050507, roughness: 0.2 }));
  bezel.position.z = 0.0555;
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.1, h - 0.1), new THREE.MeshBasicMaterial({ map: texture(c), transparent: true, toneMapped: false }));
  screen.position.z = 0.056;
  phone.add(bezel, screen);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.05, 0.024, 16, 160), glow(PAL.accent, 0.8));
  ring.position.z = -0.9;
  const orbs = [PAL.second, PAL.third, PAL.pearl].map((col, i) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.1 + 0.03 * i, 32, 16), glossy(col));
    scene.add(m);
    return m;
  });
  scene.add(phone, ring, contactShadow(2.0, -h / 2 - 0.18, 0.55));
  const LAND = 0.9;
  return {
    scene, camera, events: { land: shot.first ? 0 : LAND },
    update(lt) {
      const k = entrance(shot, lt, 0, LAND, out3);
      phone.position.y = lerp(-3.4, 0, k) + 0.035 * Math.sin(lt * 1.4);
      phone.rotation.set(-0.06 + 0.03 * Math.sin(lt * 0.9), lerp(-0.55, 0.32, inOut(lt / shot.dur)) - (1 - k) * Math.PI, 0);
      ring.rotation.set(0.25 * Math.sin(lt * 0.5), 0.35 * Math.cos(lt * 0.4), lt * 0.3);
      ring.scale.setScalar(entrance(shot, lt, 0.2, 0.8));
      orbs.forEach((m, i) => {
        const a = lt * (0.6 + 0.15 * i) + i * 2.1;
        m.position.set(0.85 * Math.cos(a), 0.75 - 0.75 * i + 0.12 * Math.sin(a * 1.3), 0.5 * Math.sin(a) - 0.2);
        m.scale.setScalar(entrance(shot, lt, 0.4 + 0.1 * i, 0.5));
      });
      aim(camera, 0, 0.15, lerp(9, 8, inOut(lt / shot.dur)));
    },
  };
};

// Cards flying in and stacking, one per item of data-items.
SHOTS.cards = async (el, shot) => {
  const { scene, camera } = stage({ tint: 0.16 });
  const labels = (el.dataset.items || ',,').split(',').map((s) => s.trim()).slice(0, 5);
  await document.fonts.load(`800 110px ${FONT}`);
  const colors = [PAL.accent, PAL.second, PAL.third];
  const group = new THREE.Group();
  const step = labels.length > 3 ? 0.6 : 0.68;
  const cards = labels.map((label, i) => {
    const [c, g] = canvas2d(1024, 318);
    g.fillStyle = hex(PAL.pearl);
    g.beginPath(); g.roundRect(0, 0, 1024, 318, 44); g.fill();
    g.fillStyle = hex(colors[i % 3]);
    g.beginPath(); g.arc(160, 159, 88, 0, 6.29); g.fill();
    g.strokeStyle = '#fff'; g.lineWidth = 22; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(118, 162); g.lineTo(148, 194); g.lineTo(206, 128); g.stroke();
    if (label) {
      let size = 110;
      g.font = `800 ${size}px ${FONT}`;
      while (g.measureText(label).width > 700 && size > 50) g.font = `800 ${(size -= 6)}px ${FONT}`;
      g.fillStyle = hex(PAL.ink);
      g.textBaseline = 'middle';
      g.fillText(label, 290, 165);
    } else {
      g.fillStyle = 'rgba(23,23,29,.18)';
      g.beginPath(); g.roundRect(290, 112, 520, 40, 20); g.roundRect(290, 178, 360, 32, 16); g.fill();
    }
    const card = new THREE.Group();
    card.add(new THREE.Mesh(new RoundedBoxGeometry(1.7, 0.527, 0.06, 4, 0.08), glossy(PAL.pearl, 0.35)));
    const face = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 0.527), new THREE.MeshBasicMaterial({ map: texture(c), transparent: true, toneMapped: false }));
    face.position.z = 0.031;
    card.add(face);
    group.add(card);
    return { card, y: ((labels.length - 1) / 2 - i) * step, x: i % 2 ? 0.07 : -0.07, delay: 0.15 + i * 0.32 };
  });
  group.scale.setScalar(Math.min(1, 2.0 / (0.527 + (labels.length - 1) * step)));
  scene.add(group, contactShadow(2.2, -1.2, 0.35));
  return {
    scene, camera,
    events: Object.fromEntries(cards.map((cd, i) => [`card-${i + 1}`, shot.first ? 0 : cd.delay + 0.2])),
    update(lt) {
      cards.forEach((cd, i) => {
        const k = entrance(shot, lt, cd.delay, 0.6);
        cd.card.position.set(lerp(3.2, cd.x, k), cd.y + 0.03 * Math.sin(lt * 1.3 + i), lerp(-2.5, 0, k));
        cd.card.rotation.set(0.05 * Math.sin(lt + i), lerp(-1.3, 0, k) + 0.14 * Math.sin(lt * 0.8 + i * 1.7), (i % 2 ? -1 : 1) * 0.03);
      });
      aim(camera, 0.5 * Math.sin(lt * 0.4), 0.25, lerp(8.6, 8.1, inOut(lt / shot.dur)));
    },
  };
};

// Bars growing to data-values: the user's real numbers, or a plain rising icon without them.
SHOTS.chart = async (el, shot) => {
  const { scene, camera } = stage({ tint: 0.16 });
  const given = (el.dataset.values || '').split(',').map(Number).filter((v) => Number.isFinite(v) && v >= 0).slice(0, 8);
  const values = given.length ? given : [2, 3, 5, 8];
  const max = Math.max(...values) || 1;
  const [bw, gap] = [0.34, 0.13];
  const span = values.length * bw + (values.length - 1) * gap;
  const base = new THREE.Mesh(new RoundedBoxGeometry(span + 0.5, 0.12, 0.95, 4, 0.05), glossy(PAL.ink, 0.4));
  base.position.y = -1.0;
  scene.add(base, contactShadow(span + 1.6, -1.07, 0.45));
  const top = values.indexOf(max);
  const bars = values.map((v, i) => {
    const m = new THREE.Mesh(new RoundedBoxGeometry(bw, 1, bw, 4, 0.06), i === top ? glossy(PAL.accent) : glossy(PAL.pearl, 0.35));
    m.position.x = -span / 2 + bw / 2 + i * (bw + gap);
    scene.add(m);
    return { m, h: Math.max(0.05, 1.7 * v / max), delay: (shot.first ? 0 : 0.2) + i * 0.18 };
  });
  const GROW = 0.8;
  return {
    scene, camera, events: { top: bars[bars.length - 1].delay + GROW },
    update(lt) {
      for (const b of bars) {
        const k = out3((lt - b.delay) / GROW);
        const h = Math.max(0.001, b.h * (shot.first ? lerp(0.35, 1, k) : k));
        b.m.scale.y = h;
        b.m.position.y = -0.94 + h / 2;
      }
      const a = lerp(-0.5, 0.3, inOut(lt / shot.dur));
      aim(camera, 8.6 * Math.sin(a), 1.4, 8.6 * Math.cos(a), [0, 0.1, 0]);
    },
  };
};

// A coin or badge spinning in and landing, with the logo (data-src) or a star on its face.
SHOTS.coin = async (el, shot) => {
  const { scene, camera } = stage({ tint: 0.24 });
  const [c, g] = canvas2d(1024, 1024);
  const grad = g.createRadialGradient(440, 400, 40, 512, 512, 520);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(1, hex(PAL.pearl.clone().lerp(PAL.accent, 0.25)));
  g.fillStyle = grad;
  g.fillRect(0, 0, 1024, 1024);
  g.strokeStyle = hex(PAL.accent);
  g.lineWidth = 26;
  g.beginPath(); g.arc(512, 512, 430, 0, 6.29); g.stroke();
  let drawn = false;
  if (el.dataset.src) {
    const img = await loadImage(el.dataset.src);
    const k = Math.min(560 / img.width, 560 / img.height);
    g.drawImage(img, 512 - img.width * k / 2, 512 - img.height * k / 2, img.width * k, img.height * k);
    drawn = readable(g);
    if (!drawn) { g.fillStyle = grad; g.fillRect(0, 0, 1024, 1024); }
  }
  if (!drawn) {
    g.fillStyle = hex(PAL.accent);
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const r = i % 2 ? 130 : 300;
      g.lineTo(512 + r * Math.cos(a), 530 + r * Math.sin(a));
    }
    g.fill();
  }
  const face = new THREE.MeshStandardMaterial({ map: texture(c), metalness: 0.3, roughness: 0.35 });
  const rim = metal(PAL.accent, 0.22);
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.75, 0.13, 96), [rim, face, face]);
  disc.rotation.set(Math.PI / 2, Math.PI / 2, 0); // a face toward the camera, upright
  const bevel = new THREE.Mesh(new THREE.TorusGeometry(0.75, 0.055, 16, 96), rim);
  const coin = new THREE.Group();
  coin.add(disc, bevel);
  const r = rng(3);
  const sparks = Array.from({ length: 14 }, (_, i) => {
    const m = new THREE.Mesh(new THREE.OctahedronGeometry(0.07, 0), glow(i % 2 ? PAL.pearl : PAL.accent, 1));
    scene.add(m);
    const a = (i / 14) * 6.28 + r() * 0.3;
    return { m, dir: [Math.cos(a), Math.sin(a)], speed: 1.6 + r() * 1.2 };
  });
  const wave = new THREE.Mesh(new THREE.TorusGeometry(1, 0.02, 8, 128), new THREE.MeshBasicMaterial({ color: PAL.accent, transparent: true, toneMapped: false }));
  scene.add(coin, wave, contactShadow(1.7, -1.15, 0.4));
  const LAND = shot.first ? 0 : 1.0;
  return {
    scene, camera, events: { land: LAND },
    update(lt) {
      const k = out3(lt / Math.max(LAND, 0.001));
      coin.position.y = (shot.first ? 0 : lerp(2.8, 0, k)) + 0.05 * Math.sin(lt * 1.5);
      coin.rotation.y = (shot.first ? 0 : (1 - k) * 4 * Math.PI) + 0.28 * Math.sin(Math.max(0, lt - LAND) * 1.2);
      coin.rotation.x = 0.06 * Math.sin(lt * 0.9);
      const after = lt - LAND;
      for (const s of sparks) {
        const d = after > 0 ? out3(after / 0.8) * s.speed : 0;
        s.m.position.set(s.dir[0] * (0.75 + d * 0.8), s.dir[1] * (0.75 + d * 0.8), 0.2);
        s.m.scale.setScalar(after > 0 && after < 0.8 ? 1 - after / 0.8 : 0.0001);
        s.m.rotation.set(lt * 3, lt * 2, 0);
      }
      wave.scale.setScalar(after > 0 ? lerp(0.8, 1.9, out3(after / 0.7)) : 0.0001);
      wave.material.opacity = after > 0 ? Math.max(0, 0.85 * (1 - after / 0.7)) : 0;
      aim(camera, 0, 0.1, lerp(8, 7.5, inOut(lt / shot.dur)));
    },
  };
};

// Flying through a tunnel of rings.
SHOTS.rings = async (el, shot) => {
  const { scene, camera } = stage({ tint: 0.3, fog: [3, 24] });
  const colors = [PAL.accent, PAL.pearl, PAL.second];
  const rings = Array.from({ length: 16 }, (_, i) => {
    const m = new THREE.Mesh(new THREE.TorusGeometry(1.25, i % 3 === 1 ? 0.045 : 0.075, 16, 120), glow(colors[i % 3], i % 3 === 1 ? 0.3 : 0.65));
    m.position.z = -i * 2.4;
    scene.add(m);
    return m;
  });
  const r = rng(11);
  const pts = new Float32Array(500 * 3);
  for (let i = 0; i < 500; i++) {
    const a = r() * 6.28;
    const d = 1.9 + r() * 2.5;
    pts.set([Math.cos(a) * d, Math.sin(a) * d, 6 - r() * 44], i * 3);
  }
  const dust = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(pts, 3)),
    new THREE.PointsMaterial({ color: PAL.pearl, size: 0.035 }));
  scene.add(dust);
  return {
    scene, camera,
    update(lt) {
      rings.forEach((m, i) => { m.rotation.z = i * 0.5 + lt * 0.5 * (i % 2 ? 1 : -1); });
      const z = lerp(6, -6 - 5 * shot.dur, inOut(lt / shot.dur) * 0.75 + (lt / shot.dur) * 0.25);
      camera.position.set(0.25 * Math.sin(lt * 0.8), 0.15 * Math.cos(lt * 0.7), z);
      camera.lookAt(0, 0, z - 10);
      camera.rotateZ(0.12 * Math.sin(lt * 0.6));
    },
  };
};

// A dotted globe, its land made-up blobs (not a map), with arcs rising between places.
SHOTS.globe = async (el, shot) => {
  const { scene, camera } = stage({ tint: 0.2 });
  const R = 0.85;
  const world = new THREE.Group();
  world.add(new THREE.Mesh(new THREE.SphereGeometry(R * 0.985, 64, 48), new THREE.MeshStandardMaterial({ color: PAL.bg.clone().lerp(PAL.accent, 0.08), roughness: 0.85, metalness: 0 })));
  const land = (p) => Math.sin(3.1 * p.x + 1.7) * Math.sin(2.3 * p.y + 0.4) * Math.sin(2.9 * p.z + 2.2) + 0.45 * Math.sin(5.3 * p.x + 4.1 * p.z) > 0.02;
  const dots = [];
  const N = 2000;
  const sea = PAL.bg.clone().lerp(PAL.pearl, 0.28);
  const pts = [];
  for (let i = 0; i < N; i++) {
    const y = 1 - (2 * (i + 0.5)) / N;
    const rr = Math.sqrt(1 - y * y);
    const a = i * 2.39996;
    const p = new THREE.Vector3(Math.cos(a) * rr, y, Math.sin(a) * rr);
    pts.push(p);
    if (land(p)) dots.push(p);
  }
  const dotMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.013, 6, 4), new THREE.MeshBasicMaterial({ toneMapped: false }), pts.length);
  const mtx = new THREE.Matrix4();
  pts.forEach((p, i) => {
    const onLand = land(p);
    dotMesh.setMatrixAt(i, mtx.makeScale(onLand ? 1 : 0.6, onLand ? 1 : 0.6, onLand ? 1 : 0.6).setPosition(p.x * R, p.y * R, p.z * R));
    dotMesh.setColorAt(i, onLand ? PAL.pearl : sea);
  });
  world.add(dotMesh);
  const r = rng(5);
  const arcs = [];
  for (let tries = 0; arcs.length < 6 && tries < 400; tries++) {
    const a = dots[Math.floor(r() * dots.length)];
    const b = dots[Math.floor(r() * dots.length)];
    const ang = a.angleTo(b);
    if (ang < 0.6 || ang > 1.7 || a.z < -0.2 || b.z < -0.2) continue;
    const mid = a.clone().add(b).normalize().multiplyScalar(R * (1 + 0.3 * ang));
    const geo = new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(a.clone().multiplyScalar(R), mid, b.clone().multiplyScalar(R)), 64, 0.012, 6);
    const tube = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: PAL.accent, toneMapped: false }));
    const pin = new THREE.Mesh(new THREE.SphereGeometry(0.045, 16, 8), new THREE.MeshBasicMaterial({ color: PAL.accent, toneMapped: false }));
    pin.position.copy(b).multiplyScalar(R);
    world.add(tube, pin);
    arcs.push({ geo, pin, delay: (shot.first ? 0 : 0.3) + arcs.length * 0.35 });
  }
  const [hc, hg] = canvas2d(256, 256);
  const halo = hg.createRadialGradient(128, 128, 60, 128, 128, 128);
  halo.addColorStop(0, hex(PAL.accent));
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  hg.fillStyle = halo;
  hg.fillRect(0, 0, 256, 256);
  const aura = new THREE.Mesh(new THREE.PlaneGeometry(2.9, 2.9), new THREE.MeshBasicMaterial({ map: texture(hc), transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false }));
  aura.position.z = -1.3;
  scene.add(aura, world);
  const DRAW = 0.8;
  return {
    scene, camera,
    events: Object.fromEntries(arcs.map((a, i) => [`arc-${i + 1}`, a.delay + DRAW])),
    update(lt) {
      world.scale.setScalar(entrance(shot, lt, 0, 0.8));
      world.rotation.set(0.35, -0.5 + 0.3 * lt, 0);
      for (const a of arcs) {
        const k = out3((lt - a.delay) / DRAW);
        a.geo.setDrawRange(0, Math.floor((a.geo.index.count / 6) * k) * 6);
        a.pin.scale.setScalar(k >= 1 ? 1 + 0.25 * Math.sin((lt - a.delay - DRAW) * 6) : 0.0001);
      }
      aim(camera, 0, 0.1, lerp(8.2, 7.4, inOut(lt / shot.dur)));
    },
  };
};

const draw = (view, lt) => {
  view.update(lt);
  renderer.render(view.scene, view.camera);
};

// ---- the timeline: one .shot element per shot, each running until the next one starts
const seconds = (v) => { v = (v || '').trim(); return v.endsWith('ms') ? parseFloat(v) / 1000 : parseFloat(v); };
const total = parseFloat(document.body.dataset.duration) || 0;
const timeline = [...document.querySelectorAll('.shot')]
  .map((el) => ({ el, type: el.dataset.shot, in: seconds(getComputedStyle(el).getPropertyValue('--in')) || 0 }))
  .sort((a, b) => a.in - b.in);
timeline.forEach((s, i) => {
  s.dur = Math.max(0.1, (timeline[i + 1] ? timeline[i + 1].in : total) - s.in);
  s.first = s.in <= 0.001; // on screen at frame 0, the cover: shown settled, without an entrance
});
let ready = false;
window.renderReady = (async () => {
  const problems = [];
  for (const s of timeline) {
    if (!SHOTS[s.type]) { problems.push(`unknown shot "${s.type}" (known: ${Object.keys(SHOTS).join(', ')})`); continue; }
    try {
      s.view = await SHOTS[s.type](s.el, s);
      for (const [name, at] of Object.entries(s.view.events || {})) s.el.style.setProperty(`--${name}`, `${(s.in + at).toFixed(2)}s`);
    } catch (e) {
      problems.push(`shot "${s.type}" at ${s.in}s: ${e.message || e}`);
    }
  }
  ready = true;
  if (problems.length) throw new Error(problems.join('; '));
})();
window.renderFrame = (t) => {
  if (!ready || !timeline.length) return;
  let i = 0;
  while (i + 1 < timeline.length && timeline[i + 1].in <= t + 1e-6) i++;
  document.body.dataset.shot = String(i);
  if (timeline[i].view) draw(timeline[i].view, Math.max(0, t - timeline[i].in), timeline[i]);
};
// Opened in a browser rather than rendered (render.js drives the page through WebDriver), it
// plays in real time alongside the CSS animations.
if (!navigator.webdriver) {
  window.renderReady.catch((e) => console.warn(e.message)).then(() => {
    const tick = () => { window.renderFrame(Math.min(total, (document.timeline.currentTime || 0) / 1000)); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
</script>
