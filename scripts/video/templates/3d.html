<!doctype html>
<!--
  Template: 3D animation, narrated (references/video-types.md: explainer,
  ad, launch, brand profile, educational). 17 seconds: a voiceover over 3D
  scenes drawn with three.js in the brand's colors, word-by-word captions
  synced to the voice, and the hook on screen from the very first frame.

  The brand's mascot presents: a robot in the brand's colors that walks, waves,
  lip-syncs to the voice, and holds up the user's own screen, in a light studio
  or at a desk at night (the mascot, desk, and title shots below).

  Usually made by scripts/video/compose.js with "style: 3d" in the script's
  frontmatter: it voices the script, gives each line a shot ([shot: hero] on
  a line picks one), times everything to the voice, and writes this page.
  By hand: each line is a scene holding
    <div class="say auto" data-voice="assets/voice-2.wav" style="--voice:3.4s">The line.</div>
  and each shot is an empty <div class="shot" data-shot="..." style="--in:3.4s">,
  usually one per line. Without a voice clip, the captions here run at a
  steady reading pace, as a preview.

  Shots (data-shot), each running from its --in until the next shot starts:
    shapes  glossy shapes floating in the brand's colors. Any line; a good hook.
    hero    a phone turning toward the camera. data-src="assets/screen.png" puts
            the user's real screenshot on its screen; without one it shows a
            generic interface. Event: --land.
    cards   cards flying in and stacking, one per item: data-items="Research,
            Write,Post" (short labels; emoji work). Events: --card-1, --card-2...
    chart   bars growing: data-values="12,30,85", the user's real numbers only.
            Without data-values it draws a plain rising icon, not data.
            Event: --top, when the last bar tops out.
    coin    a coin or badge spinning in and landing: data-src="assets/logo.png"
            puts the logo on its face, otherwise a star. Event: --land.
    rings   flying through a tunnel of rings. Energy, a transition, a hook.
    globe   a dotted globe with arcs between places, for reach and "anywhere".
            Events: --arc-1, --arc-2...
    mascot  the brand's robot mascot, alive: it blinks, breathes, lip-syncs to
            the voice, and gestures on the words. data-do picks the action:
              wave (hi; the default first shot), talk (presenting), point (at
              the screen prop), present (ta-da), cheer (jumps, confetti),
              think, shrug, sad (the problem, under a rain cloud), walk (walks
              in), dance (on the music's beat), thumbs, wow.
            data-prop puts something in its hands: phone or laptop (data-src
            = the user's real screenshot), sign (data-text, or data-src for
            their logo), screen (data-src floating beside it, for point and
            present). data-set="studio" (default, a light seamless studio) or
            "night" (dark, under a spotlight). data-face overrides the
            expression (happy, wow, love, sad, think, wink); data-frame="full",
            "mid" (waist up), or "wide". data-talk="no" keeps its mouth shut
            when the voice isn't the mascot's. Events: --jump and --land
            (cheer), --stop (walk), --point, --open (present), --show (a prop
            held up).
    desk    a cozy desk at night: the mascot types at a monitor showing the
            user's real screenshot (data-src), turns to wave, and the camera
            pushes in and flies into the screen. data-mascot="no" leaves the
            chair empty. Events: --turn, --enter (into the screen).
    title   big 3D letters dropping onto the studio floor one by one:
            data-text (one to three short words), with the mascot beside it
            unless data-mascot="no". Events: --letter-1, --letter-2..., --done.
  data-sfx on a shot cues a sound on one of its events, e.g. data-sfx="ding:land"
  (the events are set when the page loads, so render.js finds them).

  How it draws: the page defines window.renderFrame(t), which render.js calls
  with the time of every frame, so the 3D is frame-exact like the CSS. three.js
  0.186.1 comes from scripts/video/node_modules (npm install), or from
  jsDelivr when the page is opened in a browser. Colors come from --accent and
  --bg, so brand.js restyles the 3D too. Screenshots and logos must be the
  user's real ones; the shots never show people (the mascot is the brand's
  robot, never a stand-in for a customer or a team member).
  Page conventions (canvas, safe area, timing vars, backgrounds, data-sfx
  cues, music, assets): see the comment at the top of promo.html.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500&family=TikTok+Sans:wght@500..900&family=Noto+Color+Emoji&display=block">
<style>
  :root {
    --bg: #0f0f13;
    --card: #1b1b22;
    --line: #2b2b35;
    --text: #f3f2ee;
    --muted: #9a99a4;
    --accent: #e07a55;
    --ok: #3fbf7f;
    --bad: #e0605a;
    --warn: #e8b04a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: "Inter", "Liberation Sans", "Noto Color Emoji", sans-serif; color: var(--text); position: relative; }

  .glow { position: absolute; border-radius: 50%; filter: blur(120px); opacity: .55; }
  .g1 { width: 900px; height: 900px; background: #000; left: -300px; top: -200px; animation: drift1 24s linear 0s both; }
  .g2 { width: 800px; height: 800px; background: #000; right: -320px; bottom: -160px; animation: drift2 24s linear 0s both; }
  @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(260px, 520px); } }
  @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-220px, -600px); } }

  /* scenes: content kept inside the platform-UI safe zone */
  .scene { position: absolute; left: 90px; right: 150px; top: 330px; bottom: 470px;
           display: flex; flex-direction: column; justify-content: center;
           animation: sceneOut .35s ease-in var(--out, 999s) forwards; }
  @keyframes sceneOut { to { opacity: 0; transform: translateY(-60px); } }

  /* entrances; .gone also leaves at its own --out */
  .pop   { animation: popIn .5s cubic-bezier(.2,.9,.3,1.25) var(--in) both; }
  .rise  { animation: riseIn .45s cubic-bezier(.2,.8,.2,1) var(--in) both; }
  .slide { animation: slideIn .4s cubic-bezier(.2,.8,.2,1) var(--in) both; }
  .fade  { animation: fadeIn .4s ease-out var(--in) both; }
  .gone  { animation: fadeIn .35s ease-out var(--in) both, fadeOut .3s ease-in var(--out) forwards; }
  @keyframes popIn   { from { opacity: 0; transform: scale(.6) translateY(40px); } to { opacity: 1; transform: none; } }
  @keyframes riseIn  { from { opacity: 0; transform: translateY(70px); } to { opacity: 1; transform: none; } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(160px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { to { opacity: 0; } }

  .huge { font-size: 132px; font-weight: 800; line-height: 1.02; letter-spacing: -4px; }
  .big  { font-size: 104px; font-weight: 800; line-height: 1.04; letter-spacing: -3px; }
  .mid  { font-size: 64px;  font-weight: 700; line-height: 1.12; letter-spacing: -1.5px; }
  .small{ font-size: 42px;  font-weight: 500; line-height: 1.3; color: var(--muted); }
  .label{ font-size: 34px;  font-weight: 700; letter-spacing: 4px; text-transform: uppercase; }
  .accent { color: var(--accent); }
  .center { text-align: center; align-items: center; }

  /* counts up from 0 to --to, starting at --in: <span class="count" style="--in:3s; --to:40"></span>
     (--for and --ease change its pace; add class "pct" for a % sign) */
  @property --n { syntax: '<integer>'; inherits: false; initial-value: 0; }
  .count { counter-reset: n var(--n); animation: countUp var(--for, 1.2s) var(--ease, cubic-bezier(.2,.8,.2,1)) var(--in) both; }
  .pct::after { content: '%'; }
  .count::before { content: counter(n); }
  @keyframes countUp { from { --n: 0; } to { --n: var(--to); } }

  /* background media: one photo or clip per scene, behind the text (see promo.html) */
  .bg { position: absolute; inset: 0; overflow: hidden; isolation: isolate; background: #000;
        animation: fadeIn .45s ease-out var(--in) both, fadeOut .45s ease-in var(--out, 999s) forwards; }
  .bg.now { animation: fadeOut .45s ease-in var(--out, 999s) forwards; }
  .bg:empty { display: none; }
  .bg-media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0;
              filter: var(--grade, saturate(.9) contrast(1.05) brightness(.9));
              animation: var(--kb, kbIn) var(--dur, 8s) linear var(--in) both; }
  .bg.blur .bg-media { filter: var(--grade, saturate(.9) contrast(1.05) brightness(.9)) blur(var(--blur, 10px)); }
  @keyframes kbIn    { from { transform: scale(1.02); } to { transform: scale(1.14); } }
  @keyframes kbOut   { from { transform: scale(1.14); } to { transform: scale(1.02); } }
  @keyframes kbLeft  { from { transform: scale(1.14) translateX(3%); } to { transform: scale(1.14) translateX(-3%); } }
  @keyframes kbRight { from { transform: scale(1.14) translateX(-3%); } to { transform: scale(1.14) translateX(3%); } }
  .bg.tint::before { content: ''; position: absolute; inset: 0; z-index: 1; background: var(--accent); mix-blend-mode: soft-light; opacity: .5; }
  /* the user's screenshot on a screen in their photo: placed by compose.js from the screen's four corners,
     moving with the photo's own zoom */
  .bg-insert { position: absolute; inset: 0; z-index: 0; animation: var(--kb, kbIn) var(--dur, 8s) linear var(--in) both; }
  .bg-insert img { position: absolute; left: 0; top: 0; transform-origin: 0 0; filter: var(--grade, saturate(.9) contrast(1.05) brightness(.9)); }
  .bg::after { content: ''; position: absolute; inset: 0; z-index: 2;
               background: linear-gradient(to bottom, rgba(10,10,14,.72), rgba(10,10,14,.12) 30%, rgba(10,10,14,.22) 62%, rgba(10,10,14,.88)),
                           rgba(10,10,14,var(--shade, .35)); }
  body:has(.bg-media) { --muted: #d2d1d8; }
  body:has(.bg-media) .scene, body:has(.bg-media) .stage { text-shadow: 0 2px 6px rgba(0,0,0,.35), 0 4px 30px rgba(0,0,0,.55); }

  /* on screen from the very first frame, with a small settle instead of an entrance: for the
     hook, since the first frame is the default cover and the moment a viewer decides to stay */
  .now { animation: nowIn .5s cubic-bezier(.2,.8,.2,1) 0s both, fadeOut .3s ease-in var(--out, 999s) forwards; }
  @keyframes nowIn { from { transform: scale(1.05); } to { transform: none; } }

  /* the end card brand.js adds: the logo and handle, landing on the sonic logo */
  .endcard { position: absolute; left: 90px; right: 150px; top: 330px; bottom: 470px; z-index: 5;
             display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; text-align: center;
             animation: fadeIn .35s ease-out var(--in, 999s) both; }
  .endcard .logo { max-width: 380px; max-height: 300px; object-fit: contain; animation: popIn .55s cubic-bezier(.2,.9,.3,1.25) var(--in, 999s) both; }
  .endcard .handle { font-size: 60px; font-weight: 800; letter-spacing: -1px; animation: riseIn .45s cubic-bezier(.2,.8,.2,1) calc(var(--in, 999s) + .15s) both; }
  .endcard .line { font-size: 44px; font-weight: 700; line-height: 1.2; animation: riseIn .45s cubic-bezier(.2,.8,.2,1) calc(var(--in, 999s) + .3s) both; }
  .endcard .line + .line { margin-top: -22px; }
  .endcard .fine { max-width: 780px; font-size: 30px; font-weight: 600; line-height: 1.3; color: var(--muted); animation: fadeIn .4s ease-out calc(var(--in, 999s) + .4s) both; }

  /* ---- everyday / FYP kit ---- */
  body.fyp { font-family: "TikTok Sans", "Inter", "Liberation Sans", "Noto Color Emoji", sans-serif; text-wrap: pretty; }
  .fyp .huge, .fyp .big { letter-spacing: -2px; }
  .fyp .glow { opacity: .9; }
  .scene.top { justify-content: flex-start; }
  .scene.bottom { justify-content: flex-end; }
  .stack { display: grid; place-items: center; text-align: center; }
  .stack > * { grid-area: 1 / 1; }
  .swap { animation: popIn .45s cubic-bezier(.2,.9,.3,1.25) var(--in) both, fadeOut .25s ease-in var(--out, 999s) forwards; }
  body:has(.bg-media) :is(.cap, .sticker, .stamp, .say, .chat, .post, .reply, .notif, .popup, .cell, .tiers, .pane, .side) { text-shadow: none; }

  /* captions in the platforms' own style, each wrapped line boxed */
  .cap { font-size: 64px; font-weight: 700; line-height: 1.44; letter-spacing: -.5px; text-align: center; text-wrap: balance; }
  .cap > span { background: #fff; color: #121212; padding: .05em .32em; border-radius: .2em;
                -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .cap.dark > span { background: rgba(0,0,0,.76); color: #fff; }
  .cap.hl > span { background: var(--accent); color: #fff; }
  .cap.out { font-size: 82px; font-weight: 900; line-height: 1.12; color: #fff; paint-order: stroke fill; -webkit-text-stroke: 14px #000; }
  .cap.out > span { background: none; color: inherit; padding: 0; }
  .cap.left { text-align: left; }

  /* word-by-word captions: each <i> pops at its own --in, highlighted while it's the newest */
  .say { font-size: 80px; font-weight: 900; line-height: 1.16; text-align: center; color: #fff; text-wrap: balance;
         paint-order: stroke fill; -webkit-text-stroke: 14px #000; }
  .say i { font-style: normal; display: inline-block; color: var(--hi, #ffd23f);
           animation: wordIn .22s cubic-bezier(.2,1.5,.4,1) var(--in) both, wordDone .12s linear calc(var(--in) + .4s) forwards; }
  @keyframes wordIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
  @keyframes wordDone { to { color: #fff; } }

  /* the bold look (compose.js "captions: bold"): heavy capitals boxed in black, the script's
     *keywords* in yellow, a whole line on screen at once with each word popping as it's said,
     and the first line on screen from frame 0 (class "now"), which makes the cover */
  .bold .hook, .bold .say.line { text-transform: uppercase; }
  .bold .hook { font-size: 62px; font-weight: 900; line-height: 1.34; }
  .bold .hook > span { background: #0b0b0d; color: #fff; }
  /* the words carry their own black boxes, so photos keep their light: no darkening, a natural grade */
  body.bold { --grade: saturate(1.04) contrast(1.03); }
  .bold .bg::after { background: linear-gradient(to bottom, rgba(10,10,14,.45), rgba(10,10,14,0) 22%, rgba(10,10,14,0) 72%, rgba(10,10,14,.4)); }
  .bold .say.line { display: block; min-height: 0; font-size: 72px; font-weight: 900; line-height: 1.3; letter-spacing: -.5px;
                    -webkit-text-stroke: 0; animation: lineIn .2s ease-out var(--voice, 0s) both; }
  .bold .say.line.now { animation: none; }
  .bold .say.line > .ln { background: #0b0b0d; color: #fff; padding: .02em .26em .07em; border-radius: .2em;
                          -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .bold .say.line .cc { display: inline; animation: none; }
  .bold .say.line .cc i { color: #fff; animation: boldWord .3s ease-out var(--in) both; }
  .bold .kw, .bold .say.line .cc i.kw { color: var(--kw, #ffd23f); }
  /* a filmed take's captions (cut.js --bold) come a few words at a time, each chunk boxed the same way */
  .bold .say.auto:not(.line) { font-size: 70px; font-weight: 900; line-height: 1.24; text-transform: uppercase; -webkit-text-stroke: 0; }
  .bold .say.auto:not(.line) > .cc { width: fit-content; max-width: 100%; justify-self: center; background: #0b0b0d; color: #fff;
                                     padding: .04em .28em .08em; border-radius: .2em; }
  .bold .say.auto:not(.line) .cc i { color: #fff; animation: boldWord .3s ease-out var(--in) both; }
  .bold .say.auto:not(.line) .cc i.kw { color: var(--kw, #ffd23f); }
  @keyframes lineIn { from { opacity: 0; transform: translateY(24px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes boldWord { 40% { transform: translateY(-6px) scale(1.1); } }
  /* a brand name and a series tag in the top corners ("week 2"), there for the whole video */
  .corner { position: absolute; top: 254px; z-index: 6; font-size: 44px; font-weight: 900; line-height: 1.1; text-transform: uppercase;
            color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.5), 0 4px 22px rgba(0,0,0,.45); animation: fadeOut .3s ease-in var(--out, 999s) forwards; }
  .corner.brand { left: 90px; }
  .corner.series { right: 150px; }

  /* labels and reactions */
  .sticker { width: fit-content; background: var(--accent); color: #fff; font-size: 44px; font-weight: 800; line-height: 1.2;
             padding: 10px 28px 12px; border-radius: 16px; rotate: -3deg; box-shadow: 0 12px 34px rgba(0,0,0,.35); }
  .sticker.yellow { background: #ffd23f; color: #121212; }
  .sticker.light { background: #fff; color: #121212; }
  .sticker.dark { background: #121212; color: #fff; }
  .stamp { width: fit-content; color: var(--accent); border: 12px solid currentColor; border-radius: 30px; background: rgba(10,10,14,.35);
           font-size: 124px; font-weight: 900; line-height: 1.12; letter-spacing: -2px; padding: 4px 36px 10px; rotate: -7deg;
           animation: stampIn .32s cubic-bezier(.3,1.5,.5,1) var(--in) both; }
  .stamp.ok { color: var(--ok); }
  .stamp.bad { color: var(--bad); }
  @keyframes stampIn { from { opacity: 0; transform: scale(2.4); } 50% { opacity: 1; } to { opacity: 1; transform: none; } }
  .emoji { width: fit-content; font-size: 190px; line-height: 1.12;
           animation: emojiIn .55s cubic-bezier(.2,1.5,.4,1) var(--in) both, sway 1.6s ease-in-out calc(var(--in) + .55s) infinite; }
  @keyframes emojiIn { from { opacity: 0; transform: scale(.2) rotate(-25deg); } to { opacity: 1; transform: none; } }
  @keyframes sway { 0%, 100% { rotate: -5deg; } 50% { rotate: 5deg; } }

  /* timers: a 3-2-1 ring and a draining bar, both running --for (default 3s) from --in */
  @property --sweep { syntax: '<angle>'; inherits: false; initial-value: 360deg; }
  @property --left { syntax: '<integer>'; inherits: false; initial-value: 3; }
  .ring { width: 270px; height: 270px; border-radius: 50%; display: grid; place-items: center;
          background: radial-gradient(closest-side, var(--bg) 84%, transparent 85%), conic-gradient(var(--accent) var(--sweep), rgba(255,255,255,.18) 0);
          animation: popIn .4s cubic-bezier(.2,.9,.3,1.25) var(--in) both, sweep var(--for, 3s) linear var(--in) both; }
  .ring b { font-size: 130px; font-weight: 900; line-height: 1; counter-reset: left var(--left);
            animation: left var(--for, 3s) steps(3, jump-none) var(--in) both; }
  .ring b::before { content: counter(left); }
  @keyframes sweep { from { --sweep: 360deg; } to { --sweep: 0deg; } }
  @keyframes left { from { --left: 3; } to { --left: 1; } }
  .timerbar { height: 20px; border-radius: 10px; background: rgba(255,255,255,.18); overflow: hidden; animation: fadeIn .2s ease-out var(--in) both; }
  .timerbar::after { content: ''; display: block; height: 100%; border-radius: inherit; background: var(--accent); transform-origin: left;
                     animation: drain var(--for, 3s) linear var(--in) both; }
  @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  /* bars: poll options grow to --pct, a progress bar fills to --pct over --for */
  .poll { display: flex; flex-direction: column; gap: 22px; }
  .opt { position: relative; display: flex; justify-content: space-between; align-items: center; height: 124px; padding: 0 38px;
         border-radius: 28px; background: rgba(255,255,255,.13); overflow: hidden; font-size: 52px; font-weight: 800;
         animation: fadeIn .3s ease-out var(--in) both; }
  .opt::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--pct, 50) * 1%); background: var(--accent);
                 animation: grow 1.2s cubic-bezier(.2,.8,.2,1) var(--in) both; }
  .opt.alt::before { background: #5c5b68; }
  .opt > * { position: relative; }
  @keyframes grow { from { width: 0; } }
  .progress { height: 70px; border-radius: 35px; background: rgba(255,255,255,.13); border: 3px solid rgba(255,255,255,.28); overflow: hidden;
              animation: fadeIn .3s ease-out var(--in) both; }
  .progress::before { content: ''; display: block; height: 100%; width: calc(var(--pct, 100) * 1%);
                      background: repeating-linear-gradient(-45deg, var(--accent) 0 26px, color-mix(in srgb, var(--accent) 78%, #fff) 26px 52px);
                      animation: grow var(--for, 3s) var(--ease, cubic-bezier(.15,.85,.25,1)) var(--in) both; }

  /* layouts: two stacked panes, a starter-pack grid, a tier list */
  .split { flex: 1; display: flex; flex-direction: column; gap: 24px; }
  .pane, .side { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 gap: 14px; text-align: center; padding: 100px 40px 44px; background: var(--card); }
  .pane { flex: 1; border-radius: 36px; border: 2px solid var(--line); }
  :is(.pane, .side) > .sticker { position: absolute; left: 30px; top: 28px; z-index: 3; }
  :is(.pane, .side, .cell) > :not(.bg-media, .sticker) { position: relative; z-index: 2; }
  :is(.pane, .side):has(> .bg-media)::after { content: ''; position: absolute; inset: 0; z-index: 1;
                                              background: linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.55)); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .cell { position: relative; overflow: hidden; background: #fff; color: #121212; border-radius: 28px; padding: 22px 18px 24px; text-align: center;
          font-size: 38px; font-weight: 700; line-height: 1.15; box-shadow: 0 16px 40px rgba(0,0,0,.3); rotate: -1.5deg; }
  .cell:nth-child(even) { rotate: 1.5deg; }
  .cell .e { font-size: 104px; line-height: 1.2; }
  .cell, .popup b { text-wrap: balance; }
  .tiers { display: flex; flex-direction: column; gap: 10px; }
  .tier { display: flex; min-height: 128px; background: rgba(22,22,28,.9); border-radius: 18px; overflow: hidden; }
  .tier > b { flex: none; width: 124px; display: grid; place-items: center; font-size: 64px; font-weight: 900; color: #121212; background: var(--t); }
  .tier.s { --t: #ff7f7f; } .tier.a { --t: #ffbf7f; } .tier.b { --t: #ffdf7f; } .tier.c { --t: #bfff7f; } .tier.d { --t: #7fbfff; }
  .items { flex: 1; display: flex; flex-wrap: wrap; align-content: center; gap: 12px; padding: 14px 16px; }

<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---- frame, colors, helpers
const W = 1080, H = 1920;
const LIFT = 190; // the subject sits this far above the frame's middle, clear of the captions
const css = getComputedStyle(document.documentElement);
const cssColor = (name, fallback) => new THREE.Color(css.getPropertyValue(name).trim() || fallback);
const SRGB = THREE.SRGBColorSpace;
const accent = cssColor('--accent', '#e07a55');
const hsl = accent.getHSL({}, SRGB);
const PAL = {
  accent,
  second: new THREE.Color().setHSL((hsl.h + 0.55) % 1, Math.min(0.65, hsl.s), 0.56, SRGB),
  third: new THREE.Color().setHSL((hsl.h + 0.09) % 1, Math.min(0.85, hsl.s + 0.1), 0.7, SRGB),
  pearl: new THREE.Color('#f2f0ec'),
  ink: new THREE.Color('#17171d'),
  bg: cssColor('--bg', '#0f0f13'),
};
const hex = (c) => `#${c.getHexString()}`;
const clamp = (x) => Math.min(1, Math.max(0, x));
const lerp = (a, b, k) => a + (b - a) * k;
const out3 = (x) => 1 - (1 - clamp(x)) ** 3;
const inOut = (x) => { x = clamp(x); return x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2; };
const back = (x) => { x = clamp(x); return 1 + 2.6 * (x - 1) ** 3 + 1.6 * (x - 1) ** 2; };
function rng(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) >>> 0;
    let t = seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const loadImage = (src) => new Promise((resolve, reject) => {
  const img = new Image();
  img.onload = () => resolve(img);
  img.onerror = () => reject(new Error(`image didn't load: ${src}`));
  img.src = src;
});
const canvas2d = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
// a browser opened on the file (not render.js) can refuse to read a local image into WebGL
const readable = (g) => { try { g.getImageData(0, 0, 1, 1); return true; } catch { return false; } };
const texture = (c) => { const t = new THREE.CanvasTexture(c); t.colorSpace = SRGB; t.anisotropy = 4; return t; };
const FONT = getComputedStyle(document.body).fontFamily;

// ---- renderer: one WebGL canvas, lit by a studio environment for soft reflections
const renderer = new THREE.WebGLRenderer({ canvas: document.querySelector('canvas.art'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.NeutralToneMapping; // keeps the brand colors true; ACES washes them out
renderer.outputColorSpace = SRGB;
const env = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const glossy = (c, rough = 0.28) => new THREE.MeshPhysicalMaterial({ color: c, roughness: rough, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.12 });
const metal = (c, rough = 0.24) => new THREE.MeshStandardMaterial({ color: c, roughness: rough, metalness: 0.85 });
const glow = (c, k = 0.6) => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: k, roughness: 0.35, metalness: 0.2 });

// A soft radial backdrop: the brand's background, lifted toward the accent in the middle.
function backdrop(tint) {
  const [c, g] = canvas2d(270, 480);
  const mid = PAL.bg.clone().lerp(PAL.accent, tint);
  const grad = g.createRadialGradient(135, 190, 8, 135, 220, 340);
  grad.addColorStop(0, hex(mid));
  grad.addColorStop(1, hex(PAL.bg.clone().multiplyScalar(0.5)));
  g.fillStyle = grad;
  g.fillRect(0, 0, 270, 480);
  return { tex: texture(c), mid };
}

// A soft shadow on an invisible floor, under whatever stands on it.
let shadowTex;
function contactShadow(width, y, opacity = 0.5) {
  if (!shadowTex) {
    const [c, g] = canvas2d(128, 128);
    const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    grad.addColorStop(0, 'rgba(0,0,0,1)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 128, 128);
    shadowTex = new THREE.CanvasTexture(c);
  }
  const m = new THREE.Mesh(new THREE.PlaneGeometry(width, width * 0.5), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, opacity, depthWrite: false }));
  m.rotation.x = -Math.PI / 2;
  m.position.y = y;
  return m;
}

// A flat rounded rectangle, centered.
function roundedPlane(w, h, r) {
  const s = new THREE.Shape();
  s.moveTo(-w / 2 + r, -h / 2);
  s.lineTo(w / 2 - r, -h / 2); s.absarc(w / 2 - r, -h / 2 + r, r, -Math.PI / 2, 0);
  s.lineTo(w / 2, h / 2 - r); s.absarc(w / 2 - r, h / 2 - r, r, 0, Math.PI / 2);
  s.lineTo(-w / 2 + r, h / 2); s.absarc(-w / 2 + r, h / 2 - r, r, Math.PI / 2, Math.PI);
  s.lineTo(-w / 2, -h / 2 + r); s.absarc(-w / 2 + r, -h / 2 + r, r, Math.PI, Math.PI * 1.5);
  return new THREE.ShapeGeometry(s, 12);
}

// A scene with the backdrop, the environment, a key light, and an accent rim light; and a
// camera whose view is shifted so the origin lands LIFT pixels above the middle of the frame.
function stage({ fov = 30, tint = 0.2, fog } = {}) {
  const scene = new THREE.Scene();
  const bd = backdrop(tint);
  scene.background = bd.tex;
  scene.environment = env;
  if (fog) scene.fog = new THREE.Fog(bd.mid, fog[0], fog[1]);
  const key = new THREE.DirectionalLight(0xffffff, 1.5);
  key.position.set(3, 5, 6);
  const rim = new THREE.DirectionalLight(PAL.accent, 2.4);
  rim.position.set(-4, 2, -5);
  scene.add(key, rim);
  const camera = new THREE.PerspectiveCamera(fov, W / H, 0.1, 200);
  camera.setViewOffset(W, H, 0, LIFT, W, H);
  return { scene, camera };
}
const aim = (camera, x, y, z, at = [0, 0, 0]) => { camera.position.set(x, y, z); camera.lookAt(...at); };

// An entrance: 0 to 1 over `d` seconds after `delay`, or 1 at once for the shot on the cover.
const entrance = (shot, lt, delay = 0, d = 0.7, ease = back) => (shot.first ? 1 : ease((lt - delay) / d));

// ---- the shots
const SHOTS = {};

// Glossy shapes floating in the brand's colors.
SHOTS.shapes = async (el, shot) => {
  const { scene, camera } = stage({ tint: 0.22 });
  const geo = {
    box: new RoundedBoxGeometry(1, 1, 1, 4, 0.18), torus: new THREE.TorusGeometry(0.6, 0.24, 32, 96),
    sphere: new THREE.SphereGeometry(0.62, 48, 32), ico: new THREE.IcosahedronGeometry(0.66, 0),
    capsule: new THREE.CapsuleGeometry(0.34, 0.6, 8, 32), cone: new THREE.ConeGeometry(0.55, 1, 48),
    knot: new THREE.TorusKnotGeometry(0.45, 0.15, 160, 20), octa: new THREE.OctahedronGeometry(0.62, 0),
  };
  const layout = [
    ['box', PAL.accent, -0.7, 0.95, 0.2, 0.42], ['torus', PAL.pearl, 0.8, 0.72, -0.5, 0.42],
    ['sphere', PAL.second, -0.08, 0.05, 0.8, 0.46], ['ico', PAL.third, 0.72, -0.55, 0.3, 0.34],
    ['capsule', PAL.pearl, -0.86, -0.48, -0.6, 0.36], ['cone', PAL.second, 0.15, 1.32, -1.0, 0.32],
    ['knot', PAL.accent, -0.38, -1.05, 0.5, 0.3], ['octa', PAL.accent, 0.98, 1.38, -0.4, 0.24],
  ];
  const r = rng(7);
  const items = layout.map(([kind, color, x, y, z, s], i) => {
    const m = new THREE.Mesh(geo[kind], kind === 'ico' || kind === 'octa' ? metal(color, 0.3) : glossy(color));
    m.position.set(x, y, z);
    scene.add(m);
    return { m, x, y, z, s, phase: r() * 6.28, spin: [(r() - 0.5) * 1.2, (r() - 0.5) * 1.4], delay: 0.05 * i };
  });
  return {
    scene, camera,
    update(lt) {
      for (const it of items) {
        it.m.scale.setScalar(it.s * entrance(shot, lt, it.delay, 0.6));
        it.m.position.y = it.y + 0.09 * Math.sin(lt * 1.1 + it.phase);
        it.m.rotation.set(it.phase + lt * it.spin[0], it.phase * 0.7 + lt * it.spin[1], 0);
      }
      const k = inOut(lt / shot.dur);
      aim(camera, 0.35 * Math.sin(lt * 0.35), 0.1, lerp(9.6, 8.6, k));
    },
  };
};

// A phone turning toward the camera, with the user's screenshot (data-src) on its screen.
SHOTS.hero = async (el, shot) => {
  const { scene, camera } = stage({ tint: 0.18 });
  const [w, h, radius] = [0.9, 1.9, 0.12];
  const [c, g] = canvas2d(600, 1300);
  g.beginPath();
  g.roundRect(0, 0, 600, 1300, 64);
  g.clip();
  let drawn = false;
  if (el.dataset.src) {
    const img = await loadImage(el.dataset.src);
    const k = Math.max(600 / img.width, 1300 / img.height); // cover the screen, cropping the overflow
    g.drawImage(img, (600 - img.width * k) / 2, 0, img.width * k, img.height * k);
    drawn = readable(g);
  }
  if (!drawn) { // a generic interface: header, cards, a button; no text, nothing to mistake for a real product
    const grad = g.createLinearGradient(0, 0, 0, 1300);
    grad.addColorStop(0, hex(PAL.bg.clone().lerp(PAL.accent, 0.18)));
    grad.addColorStop(1, hex(PAL.bg));
    g.fillStyle = grad;
    g.fillRect(0, 0, 600, 1300);
    g.fillStyle = hex(PAL.accent);
    g.beginPath(); g.roundRect(40, 110, 520, 220, 36); g.fill();
    g.fillStyle = 'rgba(255,255,255,.55)';
    g.beginPath(); g.roundRect(80, 160, 260, 30, 15); g.roundRect(80, 215, 180, 26, 13); g.fill();
    [PAL.second, PAL.third, PAL.pearl].forEach((col, i) => {
      const y = 380 + i * 200;
      g.fillStyle = 'rgba(255,255,255,.07)';
      g.beginPath(); g.roundRect(40, y, 520, 170, 30); g.fill();
      g.fillStyle = hex(col);
      g.beginPath(); g.arc(115, y + 85, 42, 0, 6.29); g.fill();
      g.fillStyle = 'rgba(255,255,255,.4)';
      g.beginPath(); g.roundRect(185, y + 52, 290, 24, 12); g.roundRect(185, y + 96, 200, 20, 10); g.fill();
    });
    g.fillStyle = hex(PAL.accent);
    g.beginPath(); g.roundRect(40, 1060, 520, 120, 60); g.fill();
  }
  const phone = new THREE.Group();
  phone.add(new THREE.Mesh(new RoundedBoxGeometry(w, h, 0.11, 6, radius), metal(PAL.accent, 0.3)));
  const bezel = new THREE.Mesh(roundedPlane(w - 0.04, h - 0.04, radius - 0.02), new THREE.MeshStandardMaterial({ color: 0x050507, roughness: 0.2 }));
  bezel.position.z = 0.0555;
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.1, h - 0.1), new THREE.MeshBasicMaterial({ map: texture(c), transparent: true, toneMapped: false }));
  screen.position.z = 0.056;
  phone.add(bezel, screen);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.05, 0.024, 16, 160), glow(PAL.accent, 0.8));
  ring.position.z = -0.9;
  const orbs = [PAL.second, PAL.third, PAL.pearl].map((col, i) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.1 + 0.03 * i, 32, 16), glossy(col));
    scene.add(m);
    return m;
  });
  scene.add(phone, ring, contactShadow(2.0, -h / 2 - 0.18, 0.55));
  const LAND = 0.9;
  return {
    scene, camera, events: { land: shot.first ? 0 : LAND },
    update(lt) {
      const k = entrance(shot, lt, 0, LAND, out3);
      phone.position.y = lerp(-3.4, 0, k) + 0.035 * Math.sin(lt * 1.4);
      phone.rotation.set(-0.06 + 0.03 * Math.sin(lt * 0.9), lerp(-0.55, 0.32, inOut(lt / shot.dur)) - (1 - k) * Math.PI, 0);
      ring.rotation.set(0.25 * Math.sin(lt * 0.5), 0.35 * Math.cos(lt * 0.4), lt * 0.3);
      ring.scale.setScalar(entrance(shot, lt, 0.2, 0.8));
      orbs.forEach((m, i) => {
        const a = lt * (0.6 + 0.15 * i) + i * 2.1;
        m.position.set(0.85 * Math.cos(a), 0.75 - 0.75 * i + 0.12 * Math.sin(a * 1.3), 0.5 * Math.sin(a) - 0.2);
        m.scale.setScalar(entrance(shot, lt, 0.4 + 0.1 * i, 0.5));
      });
      aim(camera, 0, 0.15, lerp(9, 8, inOut(lt / shot.dur)));
    },
  };
};

// Cards flying in and stacking, one per item of data-items.
SHOTS.cards = async (el, shot) => {
  const { scene, camera } = stage({ tint: 0.16 });
  const labels = (el.dataset.items || ',,').split(',').map((s) => s.trim()).slice(0, 5);
  await document.fonts.load(`800 110px ${FONT}`);
  const colors = [PAL.accent, PAL.second, PAL.third];
  const group = new THREE.Group();
  const step = labels.length > 3 ? 0.6 : 0.68;

    face.position.z = 0.031;

  });

// Bars growing to data-values: the user's real numbers, or a plain rising icon without them.
SHOTS.chart = async (el, shot) => {
  const { scene, camera } = stage({ tint: 0.16 });
  const given = (el.dataset.values || '').split(',').map(Number).filter((v) => Number.isFinite(v) && v >= 0).slice(0, 8);
  const values = given.length ? given : [2, 3, 5, 8];
  const max = Math.max(...values) || 1;
  const [bw, gap] = [0.34, 0.13];
  const span = values.length * bw + (values.length - 1) * gap;
  const base = new THREE.Mesh(new RoundedBoxGeometry(span + 0.5, 0.12, 0.95, 4, 0.05), glossy(PAL.ink, 0.4));
  base.position.y = -1.0;
  scene.add(base, contactShadow(span + 1.6, -1.07, 0.45));
  const top = values.indexOf(max);
  const bars = values.map((v, i) => {
    const m = new THREE.Mesh(new RoundedBoxGeometry(bw, 1, bw, 4, 0.06), i === top ? glossy(PAL.accent) : glossy(PAL.pearl, 0.35));
    m.position.x = -span / 2 + bw / 2 + i * (bw + gap);
    scene.add(m);
    return { m, h: Math.max(0.05, 1.7 * v / max), delay: (shot.first ? 0 : 0.2) + i * 0.18 };
  });
  const GROW = 0.8;
  return {
    scene, camera, events: { top: bars[bars.length - 1].delay + GROW },
    update(lt) {
      for (const b of bars) {
        const k = out3((lt - b.delay) / GROW);
        const h = Math.max(0.001, b.h * (shot.first ? lerp(0.35, 1, k) : k));
        b.m.scale.y = h;
        b.m.position.y = -0.94 + h / 2;

      const a = lerp(-0.5, 0.3, inOut(lt / shot.dur));

// A coin or badge spinning in and landing, with the logo (data-src) or a star on its face.
SHOTS.coin = async (el, shot) => {
  const { scene, camera } = stage({ tint: 0.24 });
  const [c, g] = canvas2d(1024, 1024);
  const grad = g.createRadialGradient(440, 400, 40, 512, 512, 520);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(1, hex(PAL.pearl.clone().lerp(PAL.accent, 0.25)));
  g.fillStyle = grad;
  g.fillRect(0, 0, 1024, 1024);
  g.strokeStyle = hex(PAL.accent);
  g.lineWidth = 26;
  g.beginPath(); g.arc(512, 512, 430, 0, 6.29); g.stroke();
  let drawn = false;
  if (el.dataset.src) {
    const img = await loadImage(el.dataset.src);
    const k = Math.min(560 / img.width, 560 / img.height);
    g.drawImage(img, 512 - img.width * k / 2, 512 - img.height * k / 2, img.width * k, img.height * k);
    drawn = readable(g);
    if (!drawn) { g.fillStyle = grad; g.fillRect(0, 0, 1024, 1024); }
  }
  if (!drawn) {
    g.fillStyle = hex(PAL.accent);
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const r = i % 2 ? 130 : 300;
      g.lineTo(512 + r * Math.cos(a), 530 + r * Math.sin(a));
    }
    g.fill();
  }
  const face = new THREE.MeshStandardMaterial({ map: texture(c), metalness: 0.3, roughness: 0.35 });
  const rim = metal(PAL.accent, 0.22);
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.75, 0.13, 96), [rim, face, face]);
  disc.rotation.set(Math.PI / 2, Math.PI / 2, 0); // a face toward the camera, upright
  const bevel = new THREE.Mesh(new THREE.TorusGeometry(0.75, 0.055, 16, 96), rim);
  const coin = new THREE.Group();
  coin.add(disc, bevel);
  const r = rng(3);
  const sparks = Array.from({ length: 14 }, (_, i) => {
    const m = new THREE.Mesh(new THREE.OctahedronGeometry(0.07, 0), glow(i % 2 ? PAL.pearl : PAL.accent, 1));
    scene.add(m);
    const a = (i / 14) * 6.28 + r() * 0.3;
    return { m, dir: [Math.cos(a), Math.sin(a)], speed: 1.6 + r() * 1.2 };
  });
  const wave = new THREE.Mesh(new THREE.TorusGeometry(1, 0.02, 8, 128), new THREE.MeshBasicMaterial({ color: PAL.accent, transparent: true, toneMapped: false }));
  scene.add(coin, wave, contactShadow(1.7, -1.15, 0.4));
  const LAND = shot.first ? 0 : 1.0;
  return {
    scene, camera, events: { land: LAND },
    update(lt) {
      const k = out3(lt / Math.max(LAND, 0.001));
      coin.position.y = (shot.first ? 0 : lerp(2.8, 0, k)) + 0.05 * Math.sin(lt * 1.5);
      coin.rotation.y = (shot.first ? 0 : (1 - k) * 4 * Math.PI) + 0.28 * Math.sin(Math.max(0, lt - LAND) * 1.2);
      coin.rotation.x = 0.06 * Math.sin(lt * 0.9);
      const after = lt - LAND;
      for (const s of sparks) {
        const d = after > 0 ? out3(after / 0.8) * s.speed : 0;
        s.m.position.set(s.dir[0] * (0.75 + d * 0.8), s.dir[1] * (0.75 + d * 0.8), 0.2);
        s.m.scale.setScalar(after > 0 && after < 0.8 ? 1 - after / 0.8 : 0.0001);
        s.m.rotation.set(lt * 3, lt * 2, 0);
      }
      wave.scale.setScalar(after > 0 ? lerp(0.8, 1.9, out3(after / 0.7)) : 0.0001);
      wave.material.opacity = after > 0 ? Math.max(0, 0.85 * (1 - after / 0.7)) : 0;
      aim(camera, 0, 0.1, lerp(8, 7.5, inOut(lt / shot.dur)));

};

// A dotted globe, its land made-up blobs (not a map), with arcs rising between places.
SHOTS.globe = async (el, shot) => {
  const { scene, camera } = stage({ tint: 0.2 });
  const R = 0.85;
  const world = new THREE.Group();
  world.add(new THREE.Mesh(new THREE.SphereGeometry(R * 0.985, 64, 48), new THREE.MeshStandardMaterial({ color: PAL.bg.clone().lerp(PAL.accent, 0.08), roughness: 0.85, metalness: 0 })));
  const land = (p) => Math.sin(3.1 * p.x + 1.7) * Math.sin(2.3 * p.y + 0.4) * Math.sin(2.9 * p.z + 2.2) + 0.45 * Math.sin(5.3 * p.x + 4.1 * p.z) > 0.02;
  const dots = [];
  const N = 2000;
  const sea = PAL.bg.clone().lerp(PAL.pearl, 0.28);
  const pts = [];
  for (let i = 0; i < N; i++) {
    const y = 1 - (2 * (i + 0.5)) / N;
    const rr = Math.sqrt(1 - y * y);
    const a = i * 2.39996;
    const p = new THREE.Vector3(Math.cos(a) * rr, y, Math.sin(a) * rr);
    pts.push(p);
    if (land(p)) dots.push(p);
  }
  const dotMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.013, 6, 4), new THREE.MeshBasicMaterial({ toneMapped: false }), pts.length);
  const mtx = new THREE.Matrix4();
  pts.forEach((p, i) => {
    const onLand = land(p);
    dotMesh.setMatrixAt(i, mtx.makeScale(onLand ? 1 : 0.6, onLand ? 1 : 0.6, onLand ? 1 : 0.6).setPosition(p.x * R, p.y * R, p.z * R));
    dotMesh.setColorAt(i, onLand ? PAL.pearl : sea);
  });
  world.add(dotMesh);
  const r = rng(5);
  const arcs = [];
  for (let tries = 0; arcs.length < 6 && tries < 400; tries++) {
    const a = dots[Math.floor(r() * dots.length)];
    const b = dots[Math.floor(r() * dots.length)];
    const ang = a.angleTo(b);
    if (ang < 0.6 || ang > 1.7 || a.z < -0.2 || b.z < -0.2) continue;
    const mid = a.clone().add(b).normalize().multiplyScalar(R * (1 + 0.3 * ang));
    const geo = new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(a.clone().multiplyScalar(R), mid, b.clone().multiplyScalar(R)), 64, 0.012, 6);
    const tube = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: PAL.accent, toneMapped: false }));
    const pin = new THREE.Mesh(new THREE.SphereGeometry(0.045, 16, 8), new THREE.MeshBasicMaterial({ color: PAL.accent, toneMapped: false }));
    pin.position.copy(b).multiplyScalar(R);
    world.add(tube, pin);
    arcs.push({ geo, pin, delay: (shot.first ? 0 : 0.3) + arcs.length * 0.35 });
  }
  const [hc, hg] = canvas2d(256, 256);
  const halo = hg.createRadialGradient(128, 128, 60, 128, 128, 128);
  halo.addColorStop(0, hex(PAL.accent));
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  hg.fillStyle = halo;
  hg.fillRect(0, 0, 256, 256);
  const aura = new THREE.Mesh(new THREE.PlaneGeometry(2.9, 2.9), new THREE.MeshBasicMaterial({ map: texture(hc), transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false }));
  aura.position.z = -1.3;
  scene.add(aura, world);
  const DRAW = 0.8;
  return {
    scene, camera,
    events: Object.fromEntries(arcs.map((a, i) => [`arc-${i + 1}`, a.delay + DRAW])),
    update(lt) {
      world.scale.setScalar(entrance(shot, lt, 0, 0.8));
      world.rotation.set(0.35, -0.5 + 0.3 * lt, 0);
      for (const a of arcs) {
        const k = out3((lt - a.delay) / DRAW);
        a.geo.setDrawRange(0, Math.floor((a.geo.index.count / 6) * k) * 6);
        a.pin.scale.setScalar(k >= 1 ? 1 + 0.25 * Math.sin((lt - a.delay - DRAW) * 6) : 0.0001);
      }
      aim(camera, 0, 0.1, lerp(8.2, 7.4, inOut(lt / shot.dur)));
    },
  };
};


// ================= the mascot: the brand's robot, rigged, lip-synced, and holding the user's things =================

const BONES = { thigh: 0.27, shin: 0.25, upper: 0.28, fore: 0.27 };
const ANKLE = 0.115; // the ankle's height with the boot flat on the floor
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
// framings: world heights (feet to antenna) to pixel rows; the low ones leave room for a hook or CTA at the top
const SPAN = { full: [-0.02, 2.3, 430, 1330], low: [-0.02, 2.3, 620, 1390], mid: [0.55, 2.3, 400, 1290], midLow: [0.55, 2.3, 560, 1400], wide: [-0.02, 2.3, 520, 1300] };
const PAL_EYE = new THREE.Color().setHSL((hsl.h + 0.5) % 1, 0.95, 0.74, SRGB);
const plastic = (c, rough = 0.3) => new THREE.MeshPhysicalMaterial({ color: c, roughness: rough, metalness: 0, clearcoat: 0.9, clearcoatRoughness: 0.18 });
const smooth = (x, a, b) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const pulse = (x, a, b, c, d) => smooth(x, a, b) * (1 - smooth(x, c, d));
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const DOWN = V(0, -1, 0);
const UP = V(0, 1, 0);

// ---- poses: plain numbers, so any two mix. Hands are IK targets in chest space (+x is the
// mascot's left, which is the viewer's right), feet are ankle targets in the root's space.
const REST = {
  x: 0, y: 0, z: 0, turn: 0, bob: 0, squash: 0,
  lean: [0, 0], chest: [0, 0, 0], head: [0, 0, 0], shrug: 0,
  handL: [0.45, -0.34, 0.07], handR: [-0.45, -0.34, 0.07],
  footL: [0.15, ANKLE, 0.02], footR: [-0.15, ANKLE, 0.02], toeL: 0, toeR: 0,
  finger: [0, 0], thumb: [0, 0], look: [0, 0], face: 'normal',
};
function mixPose(a, b, k) {
  if (k <= 0) return a;
  if (k >= 1) return { ...a, ...b };
  const out = { ...a };
  for (const [key, v] of Object.entries(b)) {
    const from = a[key] !== undefined ? a[key] : REST[key];
    if (from === undefined) out[key] = v; // a setting only one side has (an elbow's pole): no blend
    else if (Array.isArray(v)) out[key] = v.map((x, i) => lerp(from[i], x, k));
    else if (typeof v === 'number') out[key] = lerp(from, v, k);
    else out[key] = k < 0.5 ? from : v;
  }
  return out;
}
// keyframes [[time, partial pose], ...], each eased into the next; holds the last
function track(keys, lt, base = REST) {
  let pose = mixPose(base, keys[0][1], 1);
  for (let i = 1; i < keys.length; i++) {
    const [t0] = keys[i - 1];
    const [t1, p] = keys[i];
    if (lt <= t0) break;
    pose = mixPose(pose, p, inOut((lt - t0) / Math.max(0.001, t1 - t0)));
  }
  return pose;
}

// ---- what the voice is doing: the caption words' times (render.js writes them from the voice)
let wordsCache = { count: -1, list: [] };
function spokenWords() {
  const els = document.querySelectorAll('.say i');
  if (els.length !== wordsCache.count) {
    const sec = (v) => { v = (v || '').trim(); return v.endsWith('ms') ? parseFloat(v) / 1000 : parseFloat(v); };
    wordsCache = {
      count: els.length,
      list: [...els].map((w) => ({ in: sec(w.style.getPropertyValue('--in')), done: sec(w.style.getPropertyValue('--done')), n: w.textContent.replace(/[^\p{L}\p{N}]/gu, '').length }))
        .filter((w) => Number.isFinite(w.in) && Number.isFinite(w.done) && w.done > w.in).sort((a, b) => a.in - b.in),
    };
  }
  return wordsCache.list;
}
// how open the mouth is at time t: a syllable or so per three letters of the word being said
function mouthAt(t, words) {
  for (const w of words) {
    if (w.in > t) break;
    if (t < w.done + 0.03) {
      const syl = Math.max(1, Math.round(w.n / 3));
      const ph = clamp((t - w.in) / (w.done - w.in)) * syl;
      return 0.2 + 0.8 * Math.sin(Math.PI * (ph % 1)) ** 0.7;
    }
  }
  return 0;
}
// a gesture beat: decays after each longer word starts; side alternates
function beatAt(t, words) {
  let out = 0, side = 1, n = 0;
  for (const w of words) {
    if (w.in > t) break;
    if (w.n < 4) continue;
    n++;
    const age = t - w.in;
    if (age < 1.2) { const k = Math.exp(-age * 4) * Math.min(1, age * 14); if (k > out) { out = k; side = n % 2 ? 1 : -1; } }
  }
  return [out, side];
}

// ---- the face: drawn each frame on the visor
function drawFace(g, f) {
  const [W2, H2] = [512, 328];
  g.clearRect(0, 0, W2, H2);
  const col = hex(PAL_EYE);
  g.save();
  g.shadowColor = col; g.shadowBlur = 22;
  g.fillStyle = col; g.strokeStyle = col; g.lineCap = 'round'; g.lineJoin = 'round';
  const lx = f.look[0] * 26, ly = -f.look[1] * 18;
  const eyes = [[180 + lx, 132 + ly], [332 + lx, 132 + ly]];
  const blink = clamp(f.blink);
  const pill = (x, y, w, h) => { g.beginPath(); g.roundRect(x - w / 2, y - h / 2, w, Math.max(6, h), w / 2); g.fill(); };
  const arc = (x, y) => { g.lineWidth = 22; g.beginPath(); g.arc(x, y + 22, 38, Math.PI * 1.13, Math.PI * 1.87); g.stroke(); };
  const heart = (x, y, s) => {
    g.beginPath(); g.moveTo(x, y + s * 0.62);
    g.bezierCurveTo(x - s * 1.1, y - s * 0.1, x - s * 0.55, y - s * 0.95, x, y - s * 0.38);
    g.bezierCurveTo(x + s * 0.55, y - s * 0.95, x + s * 1.1, y - s * 0.1, x, y + s * 0.62); g.fill();
  };
  const e = f.face;
  eyes.forEach(([x, y], i) => {
    if (e === 'happy' || (e === 'wink' && i === 1)) arc(x, y);
    else if (e === 'love') { g.fillStyle = '#ff6b8a'; g.shadowColor = '#ff6b8a'; heart(x, y + 6, 58); g.fillStyle = col; g.shadowColor = col; }
    else if (e === 'wow') { g.lineWidth = 18; g.beginPath(); g.arc(x, y, 44 * (1 - blink * 0.9), 0, 6.29); g.stroke(); g.beginPath(); g.arc(x, y, 12, 0, 6.29); g.fill(); }
    else {
      const h = (e === 'think' && i === 0 ? 70 : e === 'meh' ? 52 : 104) * (1 - blink * 0.94);
      pill(x, y + (e === 'meh' ? 24 : 0), 66, h);
      if (e === 'sad' || e === 'meh') { // a drooping lid
        g.save(); g.globalCompositeOperation = 'destination-out'; g.shadowBlur = 0; g.beginPath();
        const s = i ? -1 : 1; // the inner corners raised
        if (e === 'sad') { g.moveTo(x - 50, y - 70 + s * 26); g.lineTo(x + 50, y - 70 - s * 26); g.lineTo(x + 50, y - 26 - s * 26); g.lineTo(x - 50, y - 26 + s * 26); }
        else { g.rect(x - 50, y - 70, 100, 62); }
        g.fill(); g.restore();
      }
    }
  });
  // the mouth: open while a word is being said, otherwise the expression's
  const [mx, my] = [256 + lx * 0.6, 250 + ly * 0.5];
  g.lineWidth = 14;
  if (f.mouth > 0.04) {
    const o = clamp(f.mouth);
    g.beginPath(); g.ellipse(mx, my, 34 - 8 * o, 6 + 30 * o, 0, 0, 6.29); g.fill();
  } else if (e === 'wow') { g.beginPath(); g.ellipse(mx, my + 4, 15, 21, 0, 0, 6.29); g.fill(); }
  else if (e === 'sad') { g.beginPath(); g.arc(mx, my + 36, 30, Math.PI * 1.2, Math.PI * 1.8); g.stroke(); }
  else if (e === 'think' || e === 'meh') { g.beginPath(); g.moveTo(mx - 22, my + 4); g.lineTo(mx + 26, my - 2); g.stroke(); }
  else { g.beginPath(); g.arc(mx, my - 18, 30, Math.PI * 0.18, Math.PI * 0.82); g.stroke(); }
  g.restore();
  const sheen = g.createLinearGradient(0, 0, 220, 330); // the glass's soft reflection
  sheen.addColorStop(0, 'rgba(255,255,255,.10)'); sheen.addColorStop(0.45, 'rgba(255,255,255,.04)'); sheen.addColorStop(0.46, 'rgba(255,255,255,0)');
  g.fillStyle = sheen; g.fillRect(0, 0, W2, H2);
  if (e === 'happy' || e === 'love' || e === 'wink') { // blush
    g.fillStyle = 'rgba(255,120,150,.32)';
    g.beginPath(); g.ellipse(112, 226, 34, 18, 0, 0, 6.29); g.ellipse(400, 226, 34, 18, 0, 0, 6.29); g.fill();
  }
}

// ---- the robot
function buildMascot() {
  const shell = plastic(PAL.pearl, 0.26);
  const body = plastic(PAL.accent, 0.3);
  const dark = new THREE.MeshPhysicalMaterial({ color: PAL.ink, roughness: 0.4, clearcoat: 0.6, clearcoatRoughness: 0.3 });
  const glowMat = new THREE.MeshBasicMaterial({ color: PAL_EYE, toneMapped: false });
  const j = {};
  const joint = (name, parent, x, y, z) => { const g = new THREE.Group(); g.position.set(x, y, z); if (parent) j[parent].add(g); j[name] = g; return g; };
  const mesh = (parent, geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; j[parent].add(m); return m; };
  joint('root', null, 0, 0, 0);
  joint('squash', 'root', 0, 0, 0);
  joint('hips', 'squash', 0, 0.62, 0);
  joint('spine', 'hips', 0, 0.04, 0);
  joint('chest', 'spine', 0, 0.33, 0);
  joint('neck', 'chest', 0, 0.26, 0);
  joint('head', 'neck', 0, 0.05, 0);
  joint('antenna', 'head', 0, 0.7, 0);

  // body: a soft pear of the accent color, a pearl belly panel with a glowing core
  const profile = new THREE.SplineCurve([V(0.0, -0.1), V(0.27, -0.07), V(0.36, 0.08), V(0.375, 0.24), V(0.34, 0.4), V(0.26, 0.52), V(0.12, 0.6), V(0.0, 0.62)])
    .getPoints(40).map((p) => new THREE.Vector2(Math.max(0, p.x), p.y));
  mesh('spine', new THREE.LatheGeometry(profile, 56), body);
  const panel = mesh('spine', new RoundedBoxGeometry(0.4, 0.3, 0.06, 4, 0.05), shell, 0, 0.24, 0.335);
  panel.rotation.x = -0.08;
  const core = mesh('spine', new THREE.TorusGeometry(0.065, 0.018, 12, 40), glowMat, 0, 0.245, 0.37);
  core.rotation.x = -0.08;
  mesh('spine', new THREE.SphereGeometry(0.03, 16, 12), glowMat, 0, 0.245, 0.368);
  mesh('neck', new THREE.CylinderGeometry(0.09, 0.11, 0.12, 24), dark, 0, 0.0, 0);

  // head: a rounded pearl box, a dark glass visor with the face drawn on it, ears, an antenna
  mesh('head', new RoundedBoxGeometry(0.94, 0.7, 0.7, 6, 0.13), shell, 0, 0.35, 0);
  const visor = mesh('head', roundedPlane(0.76, 0.48, 0.12), new THREE.MeshBasicMaterial({ color: 0x0b0c10 }), 0, 0.35, 0.3515); // unlit: a flat glossy visor would mirror the key light white
  visor.castShadow = false;
  const [fc, fg] = canvas2d(512, 328);
  const faceTex = texture(fc);
  const face = mesh('head', new THREE.PlaneGeometry(0.72, 0.46), new THREE.MeshBasicMaterial({ map: faceTex, transparent: true, toneMapped: false, depthWrite: false }), 0, 0.35, 0.353);
  face.castShadow = false;
  for (const s of [1, -1]) {
    const ear = mesh('head', new THREE.CylinderGeometry(0.12, 0.12, 0.08, 32), body, s * 0.485, 0.36, 0);
    ear.rotation.z = Math.PI / 2;
    const cap = mesh('head', new THREE.CylinderGeometry(0.06, 0.06, 0.03, 24), dark, s * 0.535, 0.36, 0);
    cap.rotation.z = Math.PI / 2;
  }
  mesh('antenna', new THREE.CylinderGeometry(0.018, 0.024, 0.18, 12), dark, 0, 0.09, 0);
  const bulb = mesh('antenna', new THREE.SphereGeometry(0.062, 24, 16), glow(PAL.accent, 1.1), 0, 0.2, 0);

  // limbs: arms of the accent color with pearl mitten hands (a finger and a thumb that come out
  // for pointing and thumbs up), stubby legs with dark boots
  const limb = (r, len) => new THREE.CapsuleGeometry(r, len, 6, 20);
  const hands = {};
  for (const [s, side] of [['L', 1], ['R', -1]]) {
    joint('sh' + s, 'chest', side * 0.33, 0.13, 0);
    joint('el' + s, 'sh' + s, 0, -BONES.upper, 0);
    joint('ha' + s, 'el' + s, 0, -BONES.fore, 0);
    mesh('sh' + s, new THREE.SphereGeometry(0.095, 24, 16), body);
    mesh('sh' + s, limb(0.07, BONES.upper - 0.06), body, 0, -BONES.upper / 2, 0);
    mesh('el' + s, limb(0.064, BONES.fore - 0.06), shell, 0, -BONES.fore / 2, 0);
    mesh('ha' + s, new THREE.SphereGeometry(0.1, 24, 16), shell, 0, -0.04, 0);
    const finger = new THREE.Group(); finger.position.set(0, -0.08, 0.0); j['ha' + s].add(finger);
    const fm = new THREE.Mesh(limb(0.032, 0.09), shell); fm.position.y = -0.07; fm.castShadow = true; finger.add(fm);
    const thumb = new THREE.Group(); thumb.position.set(0, -0.03, 0); j['ha' + s].add(thumb);
    const tm = new THREE.Mesh(limb(0.034, 0.06), shell); tm.position.y = 0.07; tm.castShadow = true; thumb.add(tm);
    hands[s] = { finger, thumb };

    joint('hip' + s, 'hips', side * 0.15, -0.02, 0);
    joint('kn' + s, 'hip' + s, 0, -BONES.thigh, 0);
    joint('ft' + s, 'kn' + s, 0, -BONES.shin, 0);
    mesh('hip' + s, limb(0.085, BONES.thigh - 0.04), body, 0, -BONES.thigh / 2, 0);
    mesh('kn' + s, limb(0.075, BONES.shin - 0.06), shell, 0, -BONES.shin / 2, 0);
    mesh('ft' + s, new RoundedBoxGeometry(0.21, 0.12, 0.3, 4, 0.05), dark, 0, -0.045, 0.04);
    mesh('ft' + s, new RoundedBoxGeometry(0.22, 0.03, 0.31, 2, 0.012), shell, 0, -ANKLE + 0.015, 0.04);
  }
  return { root: j.root, j, hands, faceCanvas: fg, faceTex, bulb };
}

// two-bone IK: turns j1 and j2 so the chain's end reaches `target` (in j1's parent space),
// with the middle joint bending toward `pole` (a direction)
const _q = new THREE.Quaternion();
function reach(j1, j2, a, b, target, pole) {
  const d = target.clone().sub(j1.position);
  const len = Math.min(Math.max(d.length(), Math.abs(a - b) + 1e-3), a + b - 1e-3);
  const dir = d.normalize();
  const cosA = (a * a + len * len - b * b) / (2 * a * len);
  const p = pole.clone().sub(dir.clone().multiplyScalar(pole.dot(dir))).normalize();
  const elbow = dir.clone().multiplyScalar(a * cosA).add(p.multiplyScalar(a * Math.sqrt(Math.max(0, 1 - cosA * cosA))));
  j1.quaternion.setFromUnitVectors(DOWN, elbow.clone().normalize());
  const fore = dir.multiplyScalar(len).sub(elbow).normalize().applyQuaternion(_q.copy(j1.quaternion).invert());
  j2.quaternion.setFromUnitVectors(DOWN, fore);
}

const _m = new THREE.Matrix4();
const _wq = new THREE.Quaternion();
function applyPose(rig, pose) {
  const { j } = rig;
  j.root.position.set(pose.x, pose.y, pose.z);
  j.root.rotation.set(0, pose.turn, 0);
  j.squash.scale.set(1 + pose.squash * 0.5, 1 - pose.squash, 1 + pose.squash * 0.5);
  j.hips.position.y = 0.62 + pose.bob;
  j.hips.rotation.set(0, 0, 0);
  j.spine.rotation.set(pose.lean[0], 0, pose.lean[1]);
  j.chest.rotation.set(...pose.chest);
  j.head.rotation.set(pose.head[0], pose.head[1], pose.head[2]);
  j.neck.rotation.set(0, 0, 0);
  j.shL.position.y = j.shR.position.y = 0.13 + pose.shrug * 0.07;
  // arms, in chest space
  reach(j.shL, j.elL, BONES.upper, BONES.fore, V(...pose.handL), pose.poleL ? V(...pose.poleL) : V(0.55, -0.35, -0.75));
  reach(j.shR, j.elR, BONES.upper, BONES.fore, V(...pose.handR), pose.poleR ? V(...pose.poleR) : V(-0.55, -0.35, -0.75));
  // legs: foot targets in the root's space, into the hips' space
  j.squash.updateMatrix(); j.hips.updateMatrix();
  _m.multiplyMatrices(j.squash.matrix, j.hips.matrix).invert();
  for (const s of ['L', 'R']) {
    const f = pose['foot' + s];
    reach(j['hip' + s], j['kn' + s], BONES.thigh, BONES.shin, V(...f).applyMatrix4(_m), V(s === 'L' ? 0.12 : -0.12, 0, 1));
  }
  j.root.updateMatrixWorld(true);
  const rootQ = j.root.getWorldQuaternion(new THREE.Quaternion()).invert();
  for (const [i, s] of [[0, 'L'], [1, 'R']]) {
    // boots stay flat to the floor, tipping on their toes when asked
    const kq = j['kn' + s].getWorldQuaternion(_wq).premultiply(rootQ);
    j['ft' + s].quaternion.copy(kq.invert()).multiply(_q.setFromAxisAngle(V(1, 0, 0), pose['toe' + s]));
    // the finger points along the forearm; the thumb points up
    rig.hands[s].finger.scale.setScalar(Math.max(0.001, pose.finger[i]));
    rig.hands[s].thumb.scale.setScalar(Math.max(0.001, pose.thumb[i]));
    if (pose.thumb[i] > 0.001) {
      const hq = j['ha' + s].getWorldQuaternion(_wq);
      rig.hands[s].thumb.quaternion.setFromUnitVectors(UP, UP.clone().applyQuaternion(hq.invert()));
    }
  }
}

// ---- life on top of any action: breathing, a little weight shift, glances
function alive(p, lt, seed, amount = 1) {
  const b = Math.sin(lt * 2.1 + seed);
  return {
    ...p,
    bob: p.bob + 0.008 * b * amount,
    chest: [p.chest[0] - 0.02 * b * amount, p.chest[1] + 0.03 * Math.sin(lt * 0.7 + seed) * amount, p.chest[2] + 0.025 * Math.sin(lt * 0.9 + seed * 2) * amount],
    head: [p.head[0] + 0.025 * Math.sin(lt * 1.3 + seed) * amount, p.head[1] + 0.05 * Math.sin(lt * 0.6 + seed * 3) * amount, p.head[2] + 0.03 * Math.sin(lt * 0.8 + seed) * amount],
    lean: [p.lean[0], p.lean[1] + 0.015 * Math.sin(lt * 0.5 + seed) * amount],
  };
}

// presenting: hands loose in front, a beat gesture on the longer words
function talking(p, t, words, amount = 1) {
  const [k, side] = beatAt(t, words);
  const g = k * amount;
  const out = { ...p };
  const hand = side > 0 ? 'handL' : 'handR';
  const s = side > 0 ? 1 : -1;
  out[hand] = [p[hand][0] + s * 0.1 * g, p[hand][1] + 0.16 * g, p[hand][2] + 0.1 * g];
  out.head = [p.head[0] + 0.07 * g, p.head[1] - s * 0.05 * g, p.head[2]];
  out.chest = [p.chest[0] + 0.03 * g, p.chest[1] + s * 0.05 * g, p.chest[2]];
  return out;
}
const TALK = { handL: [0.3, -0.16, 0.3], handR: [-0.3, -0.16, 0.3], poleL: [0.7, -0.5, -0.4], poleR: [-0.7, -0.5, -0.4] };

// ---- the actions: each (lt, ctx) => pose, where lt is seconds into the shot
const ACTIONS = {
  talk(lt, c) { return talking(track([[0, TALK]], lt), c.t, c.words); },

  wave(lt, c) {
    const up = pulse(lt, -1, 0.35, 2.1, 2.5);
    const w = Math.sin(lt * 10.5);
    const p = mixPose(talking(mixPose(REST, TALK, smooth(lt, 2.1, 2.6)), c.t, c.words, smooth(lt, 2.3, 2.8)), {
      handR: [-0.76 - 0.07 * w, 0.36 + 0.03 * Math.abs(w), 0.14], poleR: [-0.3, -1, 0.1], chest: [0, 0.08, -0.07], head: [0.02, 0.06, 0.1], face: 'happy',
    }, up);
    return { ...p, bob: p.bob - 0.02 * up * Math.abs(Math.sin(lt * 5.25)), face: lt < 2.2 ? 'happy' : p.face };
  },

  point(lt, c) {
    const side = c.propSide;
    const aim = pulse(lt, 0.05, 0.45, 99, 100);
    const look = pulse(lt, 0.2, 0.55, 1.5, 1.9);
    const hand = side > 0 ? 'handL' : 'handR';
    const p = mixPose(talking(TALK_POSE(), c.t, c.words, 1 - aim), {
      [hand]: [side * 0.74, 0.18, 0.3], [side > 0 ? 'poleL' : 'poleR']: [side * 0.2, -1, -0.3],
      finger: side > 0 ? [1, 0] : [0, 1], chest: [0, side * 0.22, 0], lean: [0, -side * 0.03],
    }, aim);
    p.head = [p.head[0] + 0.05 * look, p.head[1] + side * 0.6 * look, p.head[2] - side * 0.06 * look];
    p.look = [side * look, 0.1 * look];
    return p;
  },

  present(lt, c) {
    const open = smooth(lt, 0.1, 0.55);
    const side = c.propSide || 0;
    const p = mixPose(TALK_POSE(), {
      handL: [0.62, 0.02 + (side > 0 ? 0.12 : 0), 0.22], handR: [-0.62, 0.02 + (side < 0 ? 0.12 : 0), 0.22],
      poleL: [0.3, -1, -0.2], poleR: [-0.3, -1, -0.2], lean: [-0.06, -side * 0.04], chest: [-0.05, side * 0.15, 0], head: [-0.06, side * 0.35, 0], face: 'happy',
    }, open);
    p.look = [side * 0.7 * pulse(lt, 0.2, 0.5, 1.4, 1.8), 0];
    p.head = [p.head[0], p.head[1] * (1 - smooth(lt, 1.4, 1.9) * 0.8), p.head[2]];
    return talking(p, c.t, c.words, smooth(lt, 1.2, 1.8) * 0.6);
  },

  cheer(lt, c) {
    const jumps = [0.35, 1.9];
    let p = mixPose(REST, { handL: [0.36, -0.2, -0.12], handR: [-0.36, -0.2, -0.12], bob: -0.1, squash: 0.08, lean: [0.12, 0], face: 'happy' }, pulse(lt, 0, 0.3, 0.32, 0.45));
    let air = 0;
    for (const t0 of jumps) {
      const u = (lt - t0) / 0.5;
      if (u > 0 && u < 1) air = Math.max(air, 4 * u * (1 - u));
    }
    const arms = smooth(lt, 0.3, 0.5);
    const pump = 0.06 * Math.sin(lt * 9) * smooth(lt, 0.9, 1.2);
    p = mixPose(p, { handL: [0.68, 0.48 + pump, 0.06], handR: [-0.68, 0.48 - pump, 0.06], poleL: [0.6, -1, 0], poleR: [-0.6, -1, 0], face: lt > 1.0 ? 'love' : 'happy' }, arms);
    const land = jumps.reduce((m, t0) => Math.max(m, pulse(lt, t0 + 0.48, t0 + 0.52, t0 + 0.56, t0 + 0.8)), 0);
    p.y = 0.55 * air;
    p.squash = p.squash - 0.1 * air + 0.12 * land;
    p.bob = p.bob - 0.1 * land;
    p.footL = [0.15, ANKLE + 0.08 * air, 0.02 - 0.05 * air]; p.footR = [-0.15, ANKLE + 0.08 * air, 0.02 - 0.05 * air];
    p.head = [p.head[0] - 0.15 * air, p.head[1], p.head[2]];
    return p;
  },

  think(lt, c) {
    const k = smooth(lt, 0, 0.5);
    const p = mixPose(REST, {
      handR: [-0.13, 0.27, 0.3], poleR: [-0.6, -0.7, -0.1], handL: [0.08, -0.06, 0.3], poleL: [0.8, -0.5, -0.2],
      head: [0.12, -0.18, 0.16], chest: [0.04, -0.08, 0.04], lean: [0.02, 0.03], face: 'think',
    }, k);
    p.look = [0.5 * k, 0.7 * k];
    p.head = [p.head[0] + 0.03 * Math.sin(lt * 2.4), p.head[1], p.head[2]];
    return p;
  },

  shrug(lt, c) {
    const k = pulse(lt, 0.05, 0.35, 1.7, 2.1);
    const p = mixPose(talking(TALK_POSE(), c.t, c.words, 1 - k), {
      handL: [0.56, -0.02, 0.26], handR: [-0.56, -0.02, 0.26], poleL: [0.4, -1, -0.3], poleR: [-0.4, -1, -0.3],
      shrug: 1, head: [-0.05, 0, 0.2], chest: [-0.04, 0, 0], face: 'meh',
    }, k);
    return p;
  },

  sad(lt) {
    const k = smooth(lt, 0, 0.6);
    const sigh = Math.sin(lt * 1.4);
    const p = mixPose(REST, {
      handL: [0.3, -0.36, 0.14], handR: [-0.3, -0.36, 0.14], lean: [0.2, 0], chest: [0.14, 0, 0], head: [0.32, 0, 0.05],
      bob: -0.03, face: 'sad',
    }, k);
    p.chest = [p.chest[0] + 0.03 * sigh, p.chest[1], p.chest[2]];
    p.shrug = -0.4 * k + 0.25 * Math.max(0, sigh) * k;
    p.look = [0, -0.4 * k];
    return p;
  },

  walk(lt, c) {
    const D = 2.0; // seconds of walking in, from off to the side
    const dist = 2.6;
    const k = clamp(lt / D);
    const period = 0.62;
    const step = dist / (D / period) / 2;
    const walking = lt < D;
    const ph = (lt / period) % 1;
    const foot = (phase) => { // stance moves back, swing lifts forward
      const z = phase < 0.5 ? lerp(step, -step, phase / 0.5) : lerp(-step, step, smooth(phase, 0.5, 1));
      const y = phase < 0.5 ? 0 : 0.11 * Math.sin(Math.PI * (phase - 0.5) / 0.5);
      return [z, y];
    };
    let p;
    if (walking) {
      const [zl, yl] = foot(ph);
      const [zr, yr] = foot((ph + 0.5) % 1);
      p = {
        ...REST, x: -c.side * dist * (1 - k), turn: c.side * Math.PI / 2,
        bob: -0.035 + 0.035 * Math.abs(Math.cos(2 * Math.PI * ph)), lean: [0.08, 0],
        footL: [0.15, ANKLE + yl, zl], footR: [-0.15, ANKLE + yr, zr], toeL: yl > 0 ? 0.3 : 0, toeR: yr > 0 ? 0.3 : 0,
        handL: [0.42, -0.28, -zl * 1.4], handR: [-0.42, -0.28, -zr * 1.4],
        head: [0, -c.side * 0.65, 0], look: [0, 0], face: 'happy',
      };
    } else {
      const u = lt - D;
      p = mixPose({ ...REST, turn: c.side * Math.PI / 2, head: [0, -c.side * 0.65, 0], face: 'happy' }, { turn: 0, head: [0, 0, 0] }, smooth(u, 0, 0.35));
      const hop = pulse(u, 0, 0.12, 0.15, 0.3);
      p.bob -= 0.05 * hop;
      p = mixPose(p, ACTIONS.wave(u - 0.25, c), smooth(u, 0.2, 0.4));
    }
    return p;
  },

  dance(lt, c) {
    const beat = 60 / c.bpm;
    const ph = (c.t - c.drop) / beat;
    const b = Math.abs(Math.sin(Math.PI * ph));
    const side = Math.floor(ph / 2) % 2 ? 1 : -1;
    const sway = Math.sin(Math.PI * ph / 2);
    const up = Math.floor(ph) % 2 === 0;
    return {
      ...REST, x: 0.12 * sway, bob: -0.07 * (1 - b), squash: 0.05 * (1 - b) - 0.03 * b,
      lean: [0.04, -0.08 * sway], chest: [0, 0.18 * sway, 0.05 * sway], head: [0.1 * (1 - b), -0.1 * sway, 0.12 * sway],
      handL: up ? [0.66, 0.46, 0.12] : [0.35, -0.05, 0.3], handR: !up ? [-0.66, 0.46, 0.12] : [-0.35, -0.05, 0.3],
      poleL: [1, -0.3, -0.2], poleR: [-1, -0.3, -0.2],
      footL: [0.17 + 0.04 * Math.max(0, side), ANKLE + 0.05 * Math.max(0, -sway) * b, 0.03], footR: [-0.17 - 0.04 * Math.max(0, -side), ANKLE + 0.05 * Math.max(0, sway) * b, 0.03],
      face: 'happy',
    };
  },

  thumbs(lt, c) {
    const k = smooth(lt, 0.1, 0.45);
    const p = mixPose(talking(TALK_POSE(), c.t, c.words, 1 - k), {
      handR: [-0.2, 0.06, 0.4], poleR: [-0.7, -0.6, -0.2], thumb: [0, 1], lean: [0.06, 0.04], head: [0.04, -0.12, -0.12], face: 'wink',
    }, k);
    p.bob -= 0.02 * pulse(lt, 0.4, 0.5, 0.55, 0.75);
    return p;
  },

  wow(lt) {
    const k = smooth(lt, 0, 0.25);
    const p = mixPose(REST, {
      handL: [0.26, 0.24, 0.3], handR: [-0.26, 0.24, 0.3], poleL: [0.9, -0.4, -0.2], poleR: [-0.9, -0.4, -0.2],
      lean: [-0.12, 0], head: [-0.12, 0, 0], z: -0.15, face: 'wow',
    }, k);
    p.y = 0.12 * pulse(lt, 0, 0.12, 0.14, 0.3);
    return p;
  },
};
const TALK_POSE = () => mixPose(REST, TALK, 1);
const ACTION_EVENTS = { cheer: { jump: 0.35, land: 0.85 }, walk: { stop: 2.0 }, point: { point: 0.35 }, present: { open: 0.4 } };

// ---- props: what the mascot holds or shows (always the user's own screenshot, logo, or words)
// The user's screenshot on a screen w x h: cropped to fill it, or with fit 'contain' whole, over a
// blurred copy of itself when its shape differs from the screen's (a phone screenshot on a monitor).
async function screenCanvas(src, w, h, radius, fit = 'cover') {
  const [c, g] = canvas2d(w, h);
  g.beginPath(); g.roundRect(0, 0, w, h, radius); g.clip();
  let drawn = false, aspect = 0;
  if (src) {
    const img = await loadImage(src);
    aspect = img.width / img.height;
    const cover = Math.max(w / img.width, h / img.height);
    const k = fit === 'contain' ? Math.min(w / img.width, h / img.height) : cover;
    if (k !== cover) {
      g.filter = 'blur(28px) brightness(.55)';
      g.drawImage(img, (w - img.width * cover) / 2, (h - img.height * cover) / 2, img.width * cover, img.height * cover);
      g.filter = 'none';
    }
    g.drawImage(img, (w - img.width * k) / 2, (h - img.height * k) / 2, img.width * k, img.height * k);
    drawn = readable(g);
  }
  if (!drawn) { // a generic interface with no words, nothing to mistake for a real product
    const grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, hex(PAL.bg.clone().lerp(PAL.accent, 0.18)));
    grad.addColorStop(1, hex(PAL.bg));
    g.fillStyle = grad; g.fillRect(0, 0, w, h);
    const u = Math.min(w, h) / 600;
    g.fillStyle = hex(PAL.accent);
    g.beginPath(); g.roundRect(40 * u, 60 * u, w - 80 * u, 170 * u, 30 * u); g.fill();
    g.fillStyle = 'rgba(255,255,255,.55)';
    g.beginPath(); g.roundRect(80 * u, 105 * u, 240 * u, 28 * u, 14 * u); g.roundRect(80 * u, 155 * u, 160 * u, 24 * u, 12 * u); g.fill();
    const rows = Math.max(2, Math.floor((h - 420 * u) / (170 * u)));
    for (let i = 0; i < rows; i++) {
      const y = 270 * u + i * 170 * u;
      g.fillStyle = 'rgba(255,255,255,.07)';
      g.beginPath(); g.roundRect(40 * u, y, w - 80 * u, 140 * u, 26 * u); g.fill();
      g.fillStyle = hex([PAL.second, PAL.third, PAL.pearl][i % 3]);
      g.beginPath(); g.arc(110 * u, y + 70 * u, 36 * u, 0, 6.29); g.fill();
      g.fillStyle = 'rgba(255,255,255,.4)';
      g.beginPath(); g.roundRect(175 * u, y + 45 * u, Math.min(290 * u, w - 260 * u), 22 * u, 11 * u); g.roundRect(175 * u, y + 82 * u, 180 * u, 18 * u, 9 * u); g.fill();
    }
    g.fillStyle = hex(PAL.accent);
    g.beginPath(); g.roundRect(40 * u, h - 150 * u, w - 80 * u, 100 * u, 50 * u); g.fill();
  }
  return { c, g, drawn, aspect };
}

async function buildSign(text, src) {
  const [w, h] = [1.0, 0.57];
  const [c, g] = canvas2d(1160, 660);
  g.fillStyle = '#fbfaf7'; g.beginPath(); g.roundRect(0, 0, 1160, 660, 48); g.fill();
  g.strokeStyle = hex(PAL.accent); g.lineWidth = 18; g.beginPath(); g.roundRect(24, 24, 1112, 612, 34); g.stroke();
  if (src) {
    const img = await loadImage(src);
    const k = Math.min(860 / img.width, 440 / img.height);
    g.drawImage(img, 580 - img.width * k / 2, 330 - img.height * k / 2, img.width * k, img.height * k);
    if (!readable(g)) { g.fillStyle = '#fbfaf7'; g.fillRect(60, 60, 1040, 540); }
  } else if (text) {
    await document.fonts.load(`900 120px ${FONT}`);
    const words = text.split(/\s+/);
    let size = 150, lines;
    const fit = () => {
      g.font = `900 ${size}px ${FONT}`;
      lines = []; let cur = '';
      for (const wd of words) { const next = cur ? `${cur} ${wd}` : wd; if (g.measureText(next).width > 960 && cur) { lines.push(cur); cur = wd; } else cur = next; }
      lines.push(cur);
      return lines.length * size * 1.08 <= 520 && lines.every((l) => g.measureText(l).width <= 980);
    };
    while (!fit() && size > 50) size -= 6;
    g.fillStyle = hex(PAL.ink); g.textAlign = 'center'; g.textBaseline = 'middle';
    lines.forEach((l, i) => g.fillText(l, 580, 330 + (i - (lines.length - 1) / 2) * size * 1.08));
  }
  const sign = new THREE.Group();
  const board = new THREE.Mesh(new RoundedBoxGeometry(w, h, 0.03, 4, 0.04), plastic(PAL.pearl, 0.4)); board.castShadow = true;
  const face = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: texture(c), transparent: true }));
  face.position.z = 0.0155;
  sign.add(board, face);
  return { group: sign, w, h };
}

async function buildScreen(src) {

  const [w, h] = aspect >= 1 ? [1.5, 1.5 / aspect] : [1.5 * aspect, 1.5];
